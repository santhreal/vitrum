[package]
name = "vitrum-grid"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "GPU terminal cell-grid renderer for vitrum terminal sessions."
readme = "README.md"
rust-version = "1.85"
keywords = ["terminal", "wgpu", "renderer", "glyph-atlas", "gpu"]
categories = ["rendering", "gui", "graphics"]

[features]
# Compile the frame-phase instrumentation points in `renderer` and the
# `probe` switch they read. Off by default: a shipped renderer carries no
# probe instruction, and `vitrum-bench frame` measures a build with this on
# against one with it off rather than asserting the difference is nothing.
probe = []

[dependencies]
# The default backend set, spelled out so that dropping one is a visible edit
# rather than a feature flag nobody reads.
#
# Direct3D 12 needs one thing from the lockfile to build. wgpu-hal hands D3D12
# handles to gpu-allocator and both name those types through the `windows`
# crate: wgpu-hal requires `^0.62`, while `tao` (the window library under the
# vendored dioxus-desktop) requires `^0.61`, so both versions are in the graph.
# gpu-allocator accepts `>=0.53, <=0.62` and cargo would rather reuse a node
# than add one, so it wires gpu-allocator to 0.61 and `D3D12_RESOURCE_DESC` and
# `ID3D12Heap` stop being the same types across the call. Cargo.lock therefore
# points gpu-allocator's `windows` edge at 0.62.2, which its range allows.
#
# Nothing has to be remembered about that: the `windows compiles` job in CI
# builds this crate for Windows on every push, and a lockfile that regresses
# the edge fails it with those two trait errors.
wgpu = { version = "29", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "gles", "vulkan", "wgsl", "webgpu"] }
bytemuck = { version = "1", features = ["derive"] }
fontdue = "0.9"
fontdb = "0.23"
ttf-parser = "0.25"
unicode-width = "0.2"
pollster = "1.0"
