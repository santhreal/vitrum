[package]
name = "vitrum-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The vitrum session daemon: owns PTYs, scrollback, and client connections."

[dependencies]
vitrum-proto = { workspace = true }
vitrum-core = { workspace = true }
vitrum-search = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# inotify, and the /proc reads that pin a change on a session. `fs` covers
# both; nothing here needs a watcher crate on top of it.
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
# `test_support::kernel_reports_other_processes`. The observation tests wait
# on an answer the probe can only give where the kernel permits it, and that
# question has one definition, in the crate that owns the probe.
vitrum-core = { workspace = true, features = ["test-support"] }
