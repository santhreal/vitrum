# cargo-deny policy for vitrum.
#
# vitrum ships as MIT OR Apache-2.0, so every crate in the graph has to be
# distributable under both. The allow list below is not a wish list: each entry
# is a licence something in this tree actually resolves to, and the ones that
# are not plain permissive carry the crate that needs them.
#
# Run it with `cargo deny check`.

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities stay deny. Unmaintained advisories are scoped to `workspace`,
# which is every crate a member of this workspace depends on directly. Off
# (`none`) is what this used to say, and it turns the check into a no-op: a
# newly unmaintained direct dependency arrives green, which is the opposite of
# what an advisory database is for. The two that are known and unfixable are
# ignored by id below, and anything else is red until somebody writes down why
# it is acceptable. cargo-deny 0.19 scopes this with all|workspace|transitive|
# none rather than warn/deny.
unmaintained = "workspace"
ignore = [
    # RUSTSEC-2024-0415: the gtk3 bindings are unmaintained in favour of gtk4.
    # gtk3 is what wry and tao bind, which is what the shipping Linux window
    # is; the tray reaches it a second way through libappindicator. gtk4 is a
    # migration of the whole webview stack and cannot start here. Re-check
    # when wry moves.
    "RUSTSEC-2024-0415",
    # RUSTSEC-2026-0192: ttf-parser is unmaintained, with skrifa named as the
    # replacement. vitrum-grid reaches it through fontdue and fontdb as well
    # as calling `Face::parse` directly for underline metrics, so moving means
    # moving all three. No vulnerability is claimed and the parser is fed
    # font files the machine already trusts enough to render.
    "RUSTSEC-2026-0192",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    # rustix, linux-raw-sys, wasi, wit-bindgen, and target-lexicon. The first
    # four also offer plain Apache-2.0 or MIT; target-lexicon offers only this.
    "Apache-2.0 WITH LLVM-exception",
    # rav1e, av1-grain, v_frame.
    "BSD-2-Clause",
    # subtle, exr, lebe, avif-serialize, ravif.
    "BSD-3-Clause",
    # libloading, untrusted, rustls-webpki, and half of ring's `Apache-2.0 AND
    # ISC`.
    "ISC",
    # The whole icu / zerovec / yoke family, and unicode-ident's
    # `(MIT OR Apache-2.0) AND Unicode-3.0`.
    "Unicode-3.0",
    # slotmap, foldhash, const_format, konst.
    "Zlib",
    # cssparser, selectors, dtoa-short, all reached through the webview stack,
    # and option-ext through dirs. MPL-2.0 is file-level copyleft: it binds the
    # files it covers, which nothing here modifies, and does not reach vitrum's
    # own sources. Compatible with distributing under MIT OR Apache-2.0.
    "MPL-2.0",
    # ksni, the Linux tray implementation, is Unlicense with no dual option.
    "Unlicense",
    # hexf-parse, and imgref's `CC0-1.0 OR Apache-2.0`.
    "CC0-1.0",
    # webpki-roots. The Mozilla root store is data, published under a data
    # licence rather than a code one, and CDLA-Permissive-2.0 imposes no
    # condition on distributing it.
    "CDLA-Permissive-2.0",
    # libfuzzer-sys is `(MIT OR Apache-2.0) AND NCSA`, so NCSA is required
    # alongside, not instead. It appears in `Cargo.lock` as an optional
    # dependency of rav1e's fuzzing feature, which nothing here enables, so it
    # is never built into a shipped binary. NCSA is BSD-shaped.
    "NCSA",
]

[bans]
# A tree this size never agrees with itself on bitflags, hashbrown, getrandom
# or windows-sys: the webview stack, tokio and the image codecs each unify
# around a different major. Denying duplicates would fail on upstream's
# schedule rather than on anything done here, so report and move on.
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Everything comes from crates.io. The two forks are path dependencies in this
# repository, not git sources, which is why there is nothing to allow here.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
