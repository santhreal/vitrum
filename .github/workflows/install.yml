name: install

# The install is one command or it is not an install.
#
# Every other gate in this repository answers a question about the source. This
# one answers the only question a person who has never seen vitrum asks: does
# the command in the README leave a working binary on a machine that had
# nothing. It runs the installer from the checkout, so a change to `install.sh`
# is judged by what it does rather than by what it says.
#
# Each distribution is a separate job because each one is a separate package
# manager, a separate package name, and a separate way of failing. A matrix
# that stops at the first red hides the other three answers.
#
# There is no macOS or Windows leg, because there is no macOS or Windows
# archive: a release carries Linux only while the terminal pane needs X11.
# `install.sh` refuses both with a sentence, and the guard suite reads that
# sentence.
on:
  push:
    branches: [main]
    paths:
      - install.sh
      - docs/install.md
      - .github/workflows/install.yml
  pull_request:
    paths:
      - install.sh
      - docs/install.md
      - .github/workflows/install.yml
  schedule:
    # A published release can rot without a commit: an asset is deleted, a
    # checksum stops matching, a base image drops a library. Weekly is often
    # enough to catch that before somebody reports it.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# The token this run carries. Nothing here writes to the repository: it builds,
# tests and reads. A default-write token in a job that only needs to read is a
# credential handed to every dependency the build downloads.
permissions:
  contents: read

concurrency:
  group: install-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Four package managers on x86_64, and one of them again on arm64. The
  # architecture is a separate leg because it is a separate published archive
  # with a separate checksum, and `aarch64-unknown-linux-gnu` was the one
  # target in the release matrix that no installer run ever downloaded: it was
  # built, uploaded, and taken on trust. One image is enough there, because
  # what differs by architecture is the asset, not the package manager.
  container:
    name: ${{ matrix.image }} on ${{ matrix.host }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, image: "ubuntu:24.04" }
          - { host: ubuntu-latest, image: "debian:12" }
          - { host: ubuntu-latest, image: "fedora:latest" }
          - { host: ubuntu-latest, image: "archlinux:latest" }
          - { host: ubuntu-24.04-arm, image: "ubuntu:24.04" }
    container:
      image: ${{ matrix.image }}
    steps:
      # Nothing is installed into the image first. A base image without curl is
      # exactly the case under test: the installer resolves and installs both
      # the tool it downloads with and vitrum's own runtime dependency, rather
      # than printing a second command for someone else to run.

      - uses: actions/checkout@v4

      - name: install
        run: sh install.sh

      # The installer writes to ~/.local/bin and edits the login files, which
      # this shell has not read. Naming the path proves the binary, and the
      # next step proves the path.
      - name: the binaries run
        run: |
          "$HOME/.local/bin/vitrum" --version
          "$HOME/.local/bin/vitrum-server" --version

      - name: a login shell finds them
        run: sh -lc 'command -v vitrum && command -v vitrum-server'

      # Removing it must leave nothing behind, or the install is a change to
      # the machine that cannot be undone.
      - name: uninstall
        run: |
          sh install.sh --uninstall
          if [ -e "$HOME/.local/bin/vitrum" ]; then
            echo "uninstall left the binary behind" >&2
            exit 1
          fi

  # Installing is half the promise. The other half is that a machine which
  # installed a release months ago reaches the current one without being
  # reinstalled, and nothing in the pipeline ever ran that path: `vitrum
  # update` was proved by unit tests against a fake release, which cannot
  # catch a real asset naming change, a checksum file that stopped listing a
  # target, or a staged binary the next start refuses to swap in.
  #
  # The starting version is resolved rather than pinned. A hardcoded 0.2.1
  # stops being the previous release the day after the next cut, and then this
  # job proves an upgrade nobody performs. Index 1 of the published stable
  # releases is whatever "the version before this one" currently means.
  update:
    name: upgrade path
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: the two ends of the upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tags=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq '[.[] | select(.prerelease == false and .draft == false) | .tag_name]')
          latest=$(printf '%s' "$tags" | jq -r '.[0] // empty')
          previous=$(printf '%s' "$tags" | jq -r '.[1] // empty')
          if [ -z "$latest" ] || [ -z "$previous" ]; then
            echo "an upgrade needs two published releases; found: $tags" >&2
            exit 1
          fi
          echo "latest=${latest#v}" >> "$GITHUB_ENV"
          echo "previous=${previous#v}" >> "$GITHUB_ENV"

      - name: install the previous release
        run: |
          sh install.sh --version="$previous"
          got=$("$HOME/.local/bin/vitrum" --version)
          case "$got" in
            *"$previous"*) ;;
            *) echo "asked for $previous and got: $got" >&2; exit 1 ;;
          esac

      # `update` stages; the swap happens on the next start, which is the
      # product's stated behaviour and the reason this needs two invocations.
      - name: update stages the new build
        run: |
          "$HOME/.local/bin/vitrum" update

      - name: the next start runs it
        run: |
          got=$("$HOME/.local/bin/vitrum" --version)
          case "$got" in
            *"$latest"*) ;;
            *) echo "staged $latest and the next start reported: $got" >&2; exit 1 ;;
          esac

      # The nightly channel publishes every day and, until this step, nothing
      # ever downloaded one of its archives. `install.sh` cannot reach the
      # channel — it resolves `v<x.y.z>` tags and a nightly lives under a
      # moving `nightly` tag — so `update` is the only way in.
      #
      # Both answers are a pass, and which one arrives is a fact about the
      # calendar rather than about the build. A nightly is a prerelease of the
      # NEXT patch, so it outranks the stable it follows on every day except
      # the one a stable is cut on: from the cut until the next nightly runs,
      # `0.3.1-nightly.*` is older than the `0.3.1` now installed and the
      # channel correctly says there is nothing newer. Demanding a download
      # there would fail this job on exactly the days a release was made.
      - name: the nightly channel answers, and serves an archive when it has one
        run: |
          out=$("$HOME/.local/bin/vitrum" update --channel nightly 2>&1)
          printf '%s\n' "$out"
          case "$out" in
            *"newest nightly release"*)
              echo "the last stable is newer than the last nightly build" ;;
            *)
              got=$("$HOME/.local/bin/vitrum" --version)
              case "$got" in
                *-nightly.*) ;;
                *) echo "staged a nightly and the next start reported: $got" >&2; exit 1 ;;
              esac ;;
          esac

      - name: uninstall
        run: sh install.sh --uninstall

  # Both channels, installed by the installer, and each one moved onto the
  # other over the top of an existing install.
  #
  # The nightly channel had no install path at all: `install.sh` resolved
  # `v<x.y.z>` tags and a nightly lives under a moving `nightly` tag, so the
  # only way onto it was to install a stable first and then run `vitrum update
  # --channel nightly`. A channel that can only be reached from another
  # channel is not a channel a new machine can install, and the release notes
  # said to install one by naming the tag, which nothing could do.
  #
  # Reinstalling over an existing install is the other path nothing ran. Every
  # container leg above starts from a machine with nothing on it, and the
  # binaries are replaced by rename rather than written in place, so an
  # install over a running or previous copy is a different code path from the
  # first one.
  channels:
    name: both channels, over each other
    runs-on: ${{ matrix.host }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      # The toolkit, so a binary that installs can also start. The installer
      # would install it through the distribution's package manager, which is
      # what the container legs above prove; this job is about channels.
      - name: system dependencies
        run: ./.github/system-deps.sh

      - name: the nightly channel installs onto a machine with nothing
        run: |
          sh install.sh --channel=nightly --no-integrate --no-deps
          got=$("$HOME/.local/bin/vitrum" --version)
          echo "$got"
          case "$got" in
            *-nightly.*) ;;
            *) echo "--channel=nightly installed: $got" >&2; exit 1 ;;
          esac
          "$HOME/.local/bin/vitrum-server" --version

      # Twice in a row. The second install replaces binaries that are already
      # there, which is the path an operator takes to move a machine forward
      # and the one no job ran.
      - name: the nightly channel installs over itself
        run: |
          sh install.sh --channel=nightly --no-integrate --no-deps
          "$HOME/.local/bin/vitrum" --version

      # Leaving the channel, which `docs/install.md` tells people to do by
      # installing a stable build over the nightly.
      - name: a stable release installs over a nightly
        run: |
          sh install.sh --no-integrate --no-deps
          got=$("$HOME/.local/bin/vitrum" --version)
          echo "$got"
          case "$got" in
            *-nightly.*) echo "installing a stable left a nightly: $got" >&2; exit 1 ;;
          esac
          "$HOME/.local/bin/vitrum-server" --version

      # And back onto it, so the move is proved in both directions rather than
      # in the one this job happened to start in.
      - name: the nightly channel installs over a stable
        run: |
          sh install.sh --channel=nightly --no-integrate --no-deps
          got=$("$HOME/.local/bin/vitrum" --version)
          case "$got" in
            *-nightly.*) ;;
            *) echo "--channel=nightly over a stable installed: $got" >&2; exit 1 ;;
          esac

      # A nightly and a version name two different builds, and asking for both
      # must be a refusal rather than a silent choice between them.
      - name: naming a version and the nightly channel is refused
        run: |
          if out=$(sh install.sh 0.1.0 --channel=nightly 2>&1); then
            echo "a version and --channel=nightly installed something: $out" >&2
            exit 1
          fi
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q 'name two different builds' ||
            { echo "refused for the wrong reason" >&2; exit 1; }

      - name: uninstall
        run: |
          sh install.sh --uninstall
          if [ -e "$HOME/.local/bin/vitrum" ]; then
            echo "uninstall left the binary behind" >&2
            exit 1
          fi
