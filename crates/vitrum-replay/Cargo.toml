[package]
name = "vitrum-replay"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Seekable session replay over scrollback bytes, with asciicast v2 import and export."
readme = "README.md"
rust-version = "1.85"
keywords = ["asciicast", "replay", "terminal", "vt100", "recording"]
categories = ["emulators", "command-line-utilities", "encoding"]

[dependencies]
vitrum-grid = { workspace = true }
vitrum-proto = { workspace = true }
vitrum-model = { workspace = true }
vitrum-search = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
memchr = { workspace = true }

# The terminal engine. Ghostty, through `vitrum-vt`, is the only VT
# implementation in this workspace, so a replayed screen and a live one are
# produced by the same parser rather than by two that agree until they do not.
vitrum-vt = { workspace = true }
