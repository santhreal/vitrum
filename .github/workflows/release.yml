name: release

# Two channels, one pipeline.
#
#  - stable: pushing `v0.1.0` publishes `v0.1.0`, forever, marked latest.
#  - nightly: a schedule, and every push to main that changes something a
#    build reads, publish to one moving `nightly` tag, marked prerelease so
#    the "latest release" lookup both installers use walks past it.
#
# Both build the same four archives with the same script and publish the same
# `SHA256SUMS` shape, because `install.sh`, `install.ps1` and `vitrum update`
# know one asset layout: `vitrum-<version>-<target>.tar.gz` from the release,
# refused unless that release's `SHA256SUMS` covers it by that exact name.
# Three things follow, and every one of them is a step below rather than a
# convention:
#
#  - the version in the archive name comes from `Cargo.toml`, the version in a
#    stable URL comes from the tag, and a release where those differ is a 404
#    for every client, so the tag and the workspace version are compared first;
#  - `SHA256SUMS` is written once, over all four archives, by the job that has
#    all four, because a builder only ever sees its own;
#  - a release with some of its assets is worse than no release, so everything
#    is uploaded to a draft and the draft is published only after the assets
#    are confirmed to be on it.
#
# Re-running either channel on a tag that already has a release is expected and
# safe, and the two channels get there differently. A stable re-run puts its
# release back into draft and strips its assets first, because the tag is
# fixed and nobody can install a draft. Nightly cannot do that: `nightly` is
# the tag an operator installs from at any hour, and emptying its release for
# the length of four uploads is a window where that tag has no assets. So a
# nightly builds a complete draft on a staging tag and swaps it onto `nightly`
# at the end, which is why the tag holds one build and never holds none.
on:
  push:
    # Both a tag push and a main push land here. Which channel a run is, and
    # whether a main push is worth a build at all, is decided in `contract`:
    # a `paths` filter here would apply to the tag push too, and a release
    # commit that touches only CHANGELOG.md would silently not publish.
    tags: ["v*"]
    branches: [main]
  schedule:
    # After the working day in every timezone this is developed in, so a
    # nightly is a build of a finished day rather than of a half-landed one.
    - cron: "17 6 * * *"
  # Re-running a failed publish must not need a second tag. Leave the input
  # empty to force a nightly instead.
  workflow_dispatch:
    inputs:
      tag:
        description: an existing v* tag to rebuild; empty for a nightly
        required: false

permissions:
  contents: write

# One run at a time per tag. Moving the nightly tag and swapping its release
# is a short sequence of API calls, and two runs doing it at once — the 06:17
# schedule and a push that lands beside it — can interleave into a release
# whose tag names the other run's commit. A stable tag is pushed once, so this
# only ever queues a re-run behind the run it is repeating. Nothing is
# cancelled: a cancelled run is a run that stopped between the tag move and
# the swap.
concurrency:
  group: release-${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'nightly' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The published platforms. `tools/release/targets.sh check` fails when this
  # set, the matrix below, `install.sh` and `install.ps1` stop agreeing.
  TARGETS: >-
    aarch64-apple-darwin
    x86_64-apple-darwin
    x86_64-pc-windows-msvc
    x86_64-unknown-linux-gnu

jobs:
  # Cheap, and it runs before four cold release builds rather than after them.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      tag: ${{ steps.channel.outputs.tag }}
      build: ${{ steps.channel.outputs.build }}
      version: ${{ steps.channel.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # A main push needs the previous commit to see what it changed.
          fetch-depth: ${{ (inputs.tag || startsWith(github.ref, 'refs/tags/')) && 1 || 0 }}

      - name: channel
        id: channel
        env:
          INPUT_TAG: ${{ inputs.tag }}
          BEFORE: ${{ github.event.before }}
        run: |
          version=$(./tools/release/versions.sh current)
          if [ -n "$INPUT_TAG" ] || [ "${GITHUB_REF%%/v*}" = refs/tags ]; then
            channel=stable
            tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
            build=true
          else
            channel=nightly
            tag=nightly
            build=true
            # The archive name is the workspace version on both channels, and
            # for a nightly the workspace is moved to a semver prerelease of
            # the next patch before the build. So the name stays
            # `vitrum-<workspace version>-<target>.tar.gz` with no second
            # naming scheme, the version sorts strictly between the last
            # stable and the next one, `vitrum --version` says which nightly a
            # binary is, and the update channel can tell two nightlies apart
            # from the asset name alone.
            version=$(./tools/release/versions.sh nightly)
            # A push to main that changed nothing a build reads is not worth
            # four cold release builds. A schedule always builds, and so does
            # the first push after a force-push, where there is no range to
            # compare against.
            if [ "$GITHUB_EVENT_NAME" = push ] &&
               git rev-parse -q --verify "$BEFORE^{commit}" >/dev/null; then
              changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" |
                grep -E '^(app/|crates/|vendor/|vendor-pty/|packaging/|Cargo\.(toml|lock)$)' || true)
              if [ -z "$changed" ]; then
                build=false
                echo "no crate, app or packaging change since $BEFORE; skipping"
              else
                echo "changed:"
                echo "$changed"
              fi
            fi
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$channel $tag, version $version, build=$build"

      # A tag whose version is not the workspace version publishes archives
      # named for one version under a URL naming another. Every installer
      # builds that URL from the tag, so every installer 404s, and the release
      # looks fine on the releases page. Nightly has no such tag to disagree
      # with: its URL names `nightly` and its archives name the workspace.
      - name: the tag and the workspace version must agree
        if: steps.channel.outputs.channel == 'stable'
        run: |
          tag="${{ steps.channel.outputs.tag }}"
          version="${tag#v}"
          declared="${{ steps.channel.outputs.version }}"
          if [ "$version" != "$declared" ]; then
            echo "tag $tag carries version $version, Cargo.toml says $declared" >&2
            exit 1
          fi

      - name: every version literal agrees
        run: ./tools/release/versions.sh check

      - name: the installers and the matrix agree on the targets
        run: ./tools/release/targets.sh check

      # The publish job reads the same section with the same matcher. Failing
      # here costs five minutes; failing there costs four release builds.
      - name: CHANGELOG.md has a section for this tag
        if: steps.channel.outputs.channel == 'stable'
        run: ./tools/release/changelog.sh notes "${{ steps.channel.outputs.version }}"

  build:
    needs: contract
    if: needs.contract.outputs.build == 'true'
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # A cold release build of the whole workspace on the slowest runner, with
    # room to spare and none for a hang.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # `macos-15-intel`, not `macos-13`. The x86_64 mac image was
          # `macos-13` until GitHub retired it, and a retired image does not
          # fail: nothing answers the label, so the job sits in `queued`. It
          # did that for this leg of the v0.1.0 tag while its three siblings
          # were picked up within three minutes, and because `publish` needs
          # the whole matrix, the tag never produced a release at all. This is
          # the label GitHub kept x86_64 macOS on after the retirement, and it
          # is itself temporary: Intel macs go away when the `macos-15` image
          # reaches end of life, and this target goes with them.
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: system webview
        if: runner.os == 'Linux'
        run: ./.github/system-webview.sh

      # `vitrum-vt` builds the Ghostty engine from source. Every release target
      # needs the toolchain, not just Linux.
      - name: zig toolchain
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          # On a runner we own the cache is kept below, so uploading it to
          # GitHub's cache service costs a post-step and buys nothing.
          use-cache: ${{ runner.environment == 'github-hosted' }}

      # setup-zig puts both zig cache directories inside the workspace, which
      # checkout wipes at the start of every run. On our own runner point them
      # somewhere that survives instead, so the cache is warm without a
      # download and without a 200s upload afterwards.
      - name: durable zig cache
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          dir="$HOME/.cache/zig-vitrum"
          mkdir -p "$dir"
          echo "ZIG_GLOBAL_CACHE_DIR=$dir" >> "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=$dir" >> "$GITHUB_ENV"

      # Zig cannot link against the Xcode 26.4 SDK: ziglang/zig#31658, fixed
      # upstream for 0.16. Against that SDK every libSystem symbol comes back
      # undefined (`_abort`, `_bzero`, `__availability_version_check`) while
      # Ghostty's shared library is linked, and the vt engine never builds.
      # `platforms.yml` has carried this step since the nightly matrix hit it;
      # this job did not, so the two mac legs of the v0.1.1 tag failed in the
      # build script while the nightly on the same image was green.
      #
      # The newest Xcode below 26.4 is selected rather than a pinned one, so a
      # runner image that drops the exact version we named still builds. When
      # Zig 0.16 lands, delete this whole step here and in `platforms.yml`:
      # nothing else depends on it.
      - name: xcode zig can link against
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "installed: $(ls -d /Applications/Xcode_*.app 2>/dev/null | tr '\n' ' ')"
          pick=""
          pick_v=""
          for app in /Applications/Xcode_*.app; do
            # An image whose Xcode is unversioned (`/Applications/Xcode.app`)
            # matches nothing, and the glob then arrives here as its own
            # literal text. Setting DEVELOPER_DIR to that path points the
            # toolchain at a directory that does not exist, which is worse
            # than leaving the default alone.
            [ -d "$app" ] || continue
            v="${app#/Applications/Xcode_}"
            v="${v%.app}"
            # 26.4 and newer carry the SDK that breaks the link.
            if [ "$(printf '%s\n26.4\n' "$v" | sort -V | head -1)" = "26.4" ]; then
              continue
            fi
            if [ -z "$pick_v" ] || [ "$(printf '%s\n%s\n' "$pick_v" "$v" | sort -V | tail -1)" = "$v" ]; then
              pick="$app"
              pick_v="$v"
            fi
          done
          if [ -n "$pick" ]; then
            echo "DEVELOPER_DIR=$pick/Contents/Developer" >> "$GITHUB_ENV"
            echo "using Xcode $pick_v"
          else
            echo "::warning::no Xcode below 26.4 on this image; the zig link may fail"
          fi
          echo "default xcode: $(xcodebuild -version 2>/dev/null | head -1)"

      # The nightly version is decided once, in `contract`, so all four
      # archives carry the same one rather than four different timestamps.
      # Writing it into the workspace here is what puts it into the archive
      # name — which is always the workspace version — and into
      # `vitrum --version`. Nothing commits it; the checkout is thrown away
      # with the runner.
      - name: the nightly version
        if: needs.contract.outputs.channel == 'nightly'
        shell: bash
        run: |
          ./tools/release/versions.sh bump "${{ needs.contract.outputs.version }}"
          git --no-pager diff --stat

      # The script names the archive from the host triple, which is the same
      # rule the installers use to look for it. Cross-compiling is not
      # attempted: both binaries link against the platform's own webview and
      # PTY, so the runner's host triple has to be the target being published.
      # If GitHub ever changes what an image is, this says so instead of
      # publishing an archive under a name nothing asks for.
      #
      # Windows defaults to pwsh, so the shell is named rather than assumed.
      - name: build the archive
        shell: bash
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "${{ matrix.target }}" ]; then
            echo "${{ matrix.os }} is $host, not ${{ matrix.target }}" >&2
            exit 1
          fi
          case " $TARGETS " in
            *" ${{ matrix.target }} "*) ;;
            *) echo "${{ matrix.target }} is not a published target" >&2; exit 1 ;;
          esac
          ./packaging/build-release-asset.sh
          want="dist/vitrum-${{ needs.contract.outputs.version }}-${{ matrix.target }}.tar.gz"
          test -f "$want" || {
            echo "expected $want, got:" >&2
            ls dist >&2
            exit 1
          }

      # Fail on the runner that produced it. The publish job checks all four
      # again, but by then four builds have run and the job that has the
      # evidence — this runner's toolchain and its CPU — has exited. This is
      # also the check that names which runner emitted the bad instructions.
      - name: the archive runs on every CPU its triple promises
        shell: bash
        run: |
          rustup component add llvm-tools
          sysroot=$(rustc --print sysroot)
          OBJDUMP=$(ls "$sysroot"/lib/rustlib/*/bin/llvm-objdump | head -1)
          export OBJDUMP
          # `tar -C` does not create its destination; it fails with
          # "Cannot open: No such file or directory" and takes the whole
          # release matrix with it.
          rm -rf isa-check
          mkdir -p isa-check
          archive="dist/vitrum-${{ needs.contract.outputs.version }}-${{ matrix.target }}.tar.gz"
          tar xzf "$archive" -C isa-check
          ./tools/release/check-isa.sh isa-check
          rm -rf isa-check

      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [contract, build]
    runs-on: ubuntu-latest
    # It downloads four archives and creates a release. Anything longer is a
    # stuck upload.
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ needs.contract.outputs.channel }}
      TAG: ${{ needs.contract.outputs.tag }}
      VERSION: ${{ needs.contract.outputs.version }}
      # Where the assets are uploaded, which is not always where they are
      # published. A stable is built in a draft on its own tag; a nightly is
      # built in a draft on a staging tag and retagged onto `nightly` once it
      # is complete. The staging name is a draft's `tag_name` and never a git
      # ref: GitHub creates the ref when a release is published, and this one
      # is renamed before that happens.
      RELEASE_TAG: ${{ needs.contract.outputs.channel == 'nightly' && 'nightly-staging' || needs.contract.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: staged
          merge-multiple: true

      # `needs: build` already fails on a builder that errored. This catches
      # the other shape: four jobs that all succeeded and produced three
      # archives, or one archive under a name no installer will ask for.
      - name: exactly the published archives arrived
        run: |
          cd staged
          missing=
          for target in $TARGETS; do
            name="vitrum-$VERSION-$target.tar.gz"
            test -f "$name" || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "no archive for:$missing" >&2
            ls -l >&2
            exit 1
          fi
          extra=$(ls *.tar.gz | while read -r f; do
            keep=
            for target in $TARGETS; do
              [ "$f" = "vitrum-$VERSION-$target.tar.gz" ] && keep=1
            done
            [ -n "$keep" ] || echo "$f"
          done)
          if [ -n "$extra" ]; then
            echo "archives nothing will download:" >&2
            echo "$extra" >&2
            exit 1
          fi
          ls -l

      # Disassemble all four archives before anything is uploaded. This is the
      # last point where every published artifact exists in one place, and it
      # is the only check that looks at what a user receives rather than at the
      # flags that were supposed to produce it.
      #
      # It runs here as well as on each builder because a per-target check only
      # ever proves the target that ran it, and a release is all four or none.
      # llvm-objdump reads Mach-O and PE as happily as ELF, so one Linux runner
      # can disassemble every archive; GNU objdump on this image cannot.
      - name: llvm-objdump
        run: rustup component add llvm-tools

      - name: no archive carries instructions above the CPU floor
        run: |
          sysroot=$(rustc --print sysroot)
          OBJDUMP=$(ls "$sysroot"/lib/rustlib/*/bin/llvm-objdump | head -1)
          export OBJDUMP
          "$OBJDUMP" --version
          cd staged
          for archive in *.tar.gz; do
            echo "== $archive"
            rm -rf unpacked
            mkdir unpacked
            tar xzf "$archive" -C unpacked
            ../tools/release/check-isa.sh unpacked
            rm -rf unpacked
          done

      # One SHA256SUMS covering every platform, written here rather than by
      # each builder, because each builder only ever sees its own archive. The
      # names in it are the plain archive names, which is what both installers
      # match against literally, and the file is the same shape on both
      # channels so nothing downstream has to know which one it came from.
      - name: checksums
        run: |
          cd staged
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      # Stable notes are the section of CHANGELOG.md for this version, which is
      # the same text the in-app dialog shows after an update. Two sources
      # would drift, and the one users read is the file.
      #
      # A nightly has no section, because it is not a version. Its notes name
      # the commit it was built from, which is the only thing anybody needs
      # from a build that will be replaced tomorrow.
      - name: release notes
        run: |
          if [ "$CHANNEL" = stable ]; then
            ./tools/release/changelog.sh notes "$VERSION" > NOTES.md
          else
            {
              printf 'Unreleased build of `main`, replaced on every nightly.\n\n'
              printf -- '- commit `%s` — %s\n' \
                "$(git rev-parse --short HEAD)" "$(git log -1 --format=%s)"
              printf -- '- built %s\n' "$(date -u +'%Y-%m-%d %H:%M UTC')"
              printf -- '- version `%s`, ahead of the last release\n\n' "$VERSION"
              printf 'Not a release. `install.sh`, `install.ps1` and `vitrum update`\n'
              printf 'ask for the latest release and skip this one, because it is\n'
              printf 'marked prerelease. Install it by naming the tag.\n'
            } > NOTES.md
          fi
          cat NOTES.md

      # A stable re-run must replace its release, not append to it. Putting it
      # back into draft first means a client cannot see a half-rebuilt
      # release, and deleting the assets means an archive from an earlier
      # attempt under a name this run no longer produces cannot survive into
      # the new release. The tag is fixed and already points at this commit,
      # so there is nothing to move.
      - name: reset an existing stable release to an empty draft
        if: env.CHANNEL == 'stable'
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "no release for $TAG yet"
            exit 0
          fi
          gh release edit "$TAG" --draft
          gh release view "$TAG" --json assets --jq '.assets[].name' |
            while read -r name; do
              echo "removing $name"
              gh release delete-asset "$TAG" "$name" --yes
            done

      # Nightly does the opposite: it does not touch the published `nightly`
      # release at all until the replacement is complete. `nightly` is a tag
      # someone installs from at an arbitrary hour, and stripping its assets
      # up front would leave it holding none for as long as four uploads take.
      #
      # The staging draft is deleted rather than reused, for the reason a
      # stable re-run strips its assets: a leftover from a failed run can hold
      # an archive under a version this run no longer produces.
      - name: discard a leftover nightly staging draft
        if: env.CHANNEL == 'nightly'
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --yes
            echo "deleted a leftover $RELEASE_TAG draft"
          else
            echo "no leftover $RELEASE_TAG draft"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.CHANNEL == 'stable' && env.TAG || format('nightly {0}', github.sha) }}
          body_path: NOTES.md
          # Uploaded as a draft. Nothing below publishes it until every asset
          # is confirmed present, so a failed upload leaves an unpublished
          # draft rather than a release that installs half of itself.
          draft: true
          files: |
            staged/*.tar.gz
            staged/SHA256SUMS
          fail_on_unmatched_files: true

      # The upload action reports success per file; this asks the release what
      # it actually holds, which is what a client will ask.
      - name: the draft holds every asset
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' |
            sort > on-release
          for target in $TARGETS; do
            echo "vitrum-$VERSION-$target.tar.gz"
          done > expected
          echo SHA256SUMS >> expected
          sort -o expected expected
          diff expected on-release || {
            echo "the draft does not hold exactly the release's assets" >&2
            exit 1
          }
          cat on-release

      # The swap, and the only part of a nightly an operator can observe.
      # Everything above left the published `nightly` release as last night
      # made it; what follows is three calls with a complete draft already in
      # hand.
      #
      #  1. the git tag moves to this commit, so the tag and the sources the
      #     archives were built from agree;
      #  2. the previous release is deleted while its replacement is still a
      #     draft, so `nightly` is never a published release whose assets came
      #     from another commit — `gh release delete` leaves the tag alone,
      #     which is why the move comes first;
      #  3. the draft is renamed onto `nightly` and published in one edit, so
      #     the release appears with every asset already on it.
      #
      # The gap where the tag has no release is that one rename, not four
      # uploads. It also fixes retention at one build: there is one nightly
      # release because the old one is deleted as the new one lands, and
      # rolling off a bad nightly is installing a stable, not fetching an
      # older nightly, because there is no older nightly to fetch.
      - name: swap the nightly release in
        if: env.CHANNEL == 'nightly'
        run: |
          repo="${{ github.repository }}"
          if gh api "repos/$repo/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$repo/git/refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            echo "moved $TAG to $GITHUB_SHA"
          else
            gh api -X POST "repos/$repo/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
            echo "created $TAG at $GITHUB_SHA"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
            echo "deleted the previous $TAG release"
          fi
          gh release edit "$RELEASE_TAG" --tag "$TAG" \
            --draft=false --prerelease --latest=false

      # `--latest` is what makes a stable the release `/releases/latest`
      # resolves to, which is the endpoint both installers use when no version
      # is given. The nightly was published by the swap above with
      # `--prerelease --latest=false`, which is what keeps it out of that
      # endpoint and out of `vitrum update`.
      - name: publish the stable release
        if: env.CHANNEL == 'stable'
        run: gh release edit "$TAG" --draft=false --prerelease=false --latest

      # Both channels end here, asking the release the same question an
      # installer will.
      - name: what an installer now sees
        run: |
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,isLatest
          gh release view "$TAG" --json assets --jq '.assets[].name'
