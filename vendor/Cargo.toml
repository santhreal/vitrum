# A fork of `dioxus-desktop` 0.7.10, vendored rather than patched.
#
# It is a real, named dependency because `[patch.crates-io]` is ignored by
# anyone installing `vitrum` from a registry: a published client would have
# built against upstream and shipped one WebKit network process per window.
# See README.md for the single divergence and when this goes away.

[package]
edition = "2021"
rust-version = "1.76.0"
name = "vitrum-dioxus-desktop"
version = "0.7.10"
authors = ["Jonathan Kelley"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "WebView renderer for Dioxus, forked for vitrum so every window shares one web process."
readme = "README.md"
keywords = [
    "dom",
    "ui",
    "gui",
    "react",
]
license = "MIT"
repository = "https://github.com/santhreal/vitrum"
# Upstream ships these and nothing here builds them: the test targets need dev
# dependencies this fork does not carry, and the diagram is 344 KB.
exclude = [
    ".vscode",
    "architecure",
    "headless_tests",
]

[package.metadata.docs.rs]
features = [
    "tokio_runtime",
    "devtools",
]
cargo-args = [
    "-Zunstable-options",
    "-Zrustdoc-scrape-examples",
]
default-features = false
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
]

[features]
default = [
    "tokio_runtime",
    "transparent",
    "devtools",
]
devtools = [
    "wry/devtools",
    "dep:dioxus-devtools",
    "dioxus-signals",
]
fullscreen = ["wry/fullscreen"]
gnu = []
tokio_runtime = ["dep:tokio"]
transparent = ["wry/transparent"]

[lib]
name = "vitrum_dioxus_desktop"
path = "src/lib.rs"
# Upstream's doc examples are not this project's test surface. They are written
# against `dioxus::desktop::*` and `rsx!`, which need the full `dioxus` crate as
# a dev dependency; this fork carries none, for the same reason it excludes the
# test targets above. Editing them would add divergence from upstream to every
# file that has one, and the point of this fork is to have exactly one.
doctest = false

[dependencies.anyhow]
version = "1.0.98"

[dependencies.base64]
version = "0.22.1"

[dependencies.bytes]
version = "1.10.1"

[dependencies.dioxus-asset-resolver]
version = "0.7.10"
features = ["native"]

[dependencies.dioxus-cli-config]
version = "0.7.10"

[dependencies.dioxus-core]
version = "0.7.10"
features = ["serialize"]

[dependencies.dioxus-devtools]
version = "0.7.10"
optional = true

[dependencies.dioxus-document]
version = "0.7.10"
default-features = false

[dependencies.dioxus-history]
version = "0.7.10"
default-features = false

[dependencies.dioxus-hooks]
version = "0.7.10"

[dependencies.dioxus-html]
version = "0.7.10"
features = ["serialize"]
default-features = false

[dependencies.dioxus-interpreter-js]
version = "0.7.10"
features = [
    "binary-protocol",
    "serialize",
]

[dependencies.dioxus-signals]
version = "0.7.10"
optional = true

[dependencies.futures-channel]
version = "0.3.32"

[dependencies.futures-util]
version = "0.3.32"
default-features = false

[dependencies.generational-box]
version = "0.7.10"

[dependencies.image]
version = "0.25.6"

[dependencies.libc]
version = "0.2.174"

[dependencies.percent-encoding]
version = "2.3.1"

[dependencies.rand]
version = "0.9"
features = ["std_rng"]

[dependencies.rustc-hash]
version = "2.1.1"

[dependencies.serde]
version = "1.0.225"

[dependencies.serde_json]
version = "1.0.140"

[dependencies.slab]
version = "0.4.10"

[dependencies.subtle]
version = "2.6"
features = ["const-generics"]

[dependencies.tao]
version = "0.34.0"
features = [
    "rwh_05",
]

[dependencies.thiserror]
version = "2.0.12"

[dependencies.tokio]
version = "1.48"
features = [
    "sync",
    "rt-multi-thread",
    "rt",
    "time",
    "macros",
    "fs",
    "io-util",
]
optional = true

[dependencies.tracing]
version = "0.1.41"

[dependencies.webbrowser]
version = "1.0"

[dependencies.wry]
version = "0.53.5"
features = [
    "os-webview",
    "protocol",
    "drag-drop",
]
default-features = false

[build-dependencies.lazy-js-bundle]
version = "0.7.10"

[target.'cfg(any(target_os = "windows",target_os = "macos",target_os = "linux"))'.dependencies.tray-icon]
version = "0.21.0"

[target.'cfg(any(target_os = "windows",target_os = "macos",target_os = "linux",target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies.global-hotkey]
version = "0.7.0"

[target.'cfg(any(target_os = "windows",target_os = "macos",target_os = "linux",target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies.muda]
version = "0.17.0"

[target.'cfg(any(target_os = "windows",target_os = "macos",target_os = "linux",target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies.rfd]
version = "0.17.2"
features = ["xdg-portal"]
default-features = false

[target.'cfg(not(target_os = "android"))'.dependencies.tungstenite]
version = "0.28.0"
features = ["native-tls"]

[target.'cfg(target_os = "android")'.dependencies.jni]
version = "0.21.1"

[target.'cfg(target_os = "android")'.dependencies.ndk]
version = "0.9.0"

[target.'cfg(target_os = "android")'.dependencies.ndk-context]
version = "0.1.1"

[target.'cfg(target_os = "android")'.dependencies.ndk-sys]
version = "0.6.0"

[target.'cfg(target_os = "android")'.dependencies.tungstenite]
version = "0.28.0"
features = ["rustls"]

[target.'cfg(target_os = "ios")'.dependencies.objc]
version = "0.2.7"

[target.'cfg(target_os = "ios")'.dependencies.objc_id]
version = "0.1.1"

[target.'cfg(target_os = "linux")'.dependencies.wry]
version = "0.53.5"
features = [
    "os-webview",
    "protocol",
    "drag-drop",
    "linux-body",
]
default-features = false

# Needed to keep every window in ONE WebKitWebProcess: the relation target has
# to be a view that is still live, which means naming the type to ask GTK
# whether its widget survived. Pinned to exactly what wry 0.53.5 links so cargo
# unifies them instead of building a second, incompatible GTK stack.
[target.'cfg(target_os = "linux")'.dependencies.webkit2gtk]
version = "=2.0.1"
features = ["v2_38"]

[target.'cfg(target_os = "linux")'.dependencies.gtk]
version = "0.18"

[target.'cfg(target_os = "macos")'.dependencies.cocoa]
version = "0.26.1"

[target.'cfg(target_os = "macos")'.dependencies.core-foundation]
version = "0.10.1"

[target.'cfg(target_os = "macos")'.dependencies.objc]
version = "0.2.7"

[target."cfg(unix)".dependencies.signal-hook]
version = "0.3.18"
