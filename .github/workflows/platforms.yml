name: platforms

# The platforms we ship and do not develop on, at the cadence they are worth.
#
# `ci.yml` gates every push on x86-64 Linux, because that is where a defect is
# found per minute of runner time. This workflow answers the other question,
# which is whether the tree still builds and passes on macOS, on Windows, and
# on ARM Linux, which is a different code generator against the same
# libraries. It runs:
#
#   - on every release tag, because a platform break must never reach a user
#   - nightly, so the worst case is one day of main being broken on a platform
#     rather than one release cycle
#   - on any change that touches platform-conditional code, the vendored
#     webview, a build script, or an installer, which is where the breaks
#     historically are
#   - on demand
#
# The nightly run is what makes the path filter safe. A filter can only list
# the places a platform break is likely, and a break that arrives somewhere
# else is caught within a day rather than at the next release.
on:
  push:
    tags: ["v*"]
  schedule:
    # Early morning UTC, when nothing else is queued.
    - cron: "0 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      # Platform-conditional code and the things that decide how it is built.
      - "**/build.rs"
      - "vendor/**"
      - "vendor-pty/**"
      - "crates/vitrum-vt/**"
      - "packaging/**"
      - "install.sh"
      - "install.ps1"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/platforms.yml"
      - ".github/actions/**"

concurrency:
  group: platforms-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A cold Windows build is the long pole here.
    timeout-minutes: 60
    strategy:
      # Which platform broke is the useful part of the answer, so one failing
      # must not cancel the other.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}

      # ARM Linux is Linux: it links the same system webview, and the image
      # does not ship it.
      - name: system webview
        if: runner.os == 'Linux'
        run: ./.github/system-webview.sh

      # The terminal engine is built from Ghostty source by `vitrum-vt`, whose
      # default `vendored` route needs Zig. The version is the one Ghostty
      # pins: a newer Zig fails Ghostty's own build-version check, so this is
      # not a floating "latest".
      - name: zig toolchain
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          # On a runner we own the cache is kept below, so uploading it to
          # GitHub's cache service costs a post-step and buys nothing.
          use-cache: ${{ runner.environment == 'github-hosted' }}

      # setup-zig puts both zig cache directories inside the workspace, which
      # checkout wipes at the start of every run. On our own runner point them
      # somewhere that survives instead, so the cache is warm without a
      # download and without a 200s upload afterwards.
      - name: durable zig cache
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          dir="$HOME/.cache/zig-vitrum"
          mkdir -p "$dir"
          echo "ZIG_GLOBAL_CACHE_DIR=$dir" >> "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=$dir" >> "$GITHUB_ENV"

      # Zig cannot link against the Xcode 26.4 SDK: ziglang/zig#31658, fixed
      # upstream for 0.16. Against that SDK every libSystem symbol comes back
      # undefined (`_abort`, `_bzero`, `__availability_version_check`) while
      # Ghostty's shared library is linked, and the vt engine never builds.
      #
      # The newest Xcode below 26.4 is selected rather than a pinned one, so a
      # runner image that drops the exact version we named still builds. When
      # Zig 0.16 lands, delete this whole step: nothing else depends on it.
      - name: xcode zig can link against
        if: runner.os == 'macOS'
        run: |
          echo "installed: $(ls -d /Applications/Xcode_*.app 2>/dev/null | tr '\n' ' ')"
          pick=""
          pick_v=""
          for app in /Applications/Xcode_*.app; do
            v="${app#/Applications/Xcode_}"
            v="${v%.app}"
            # 26.4 and newer carry the SDK that breaks the link.
            if [ "$(printf '%s\n26.4\n' "$v" | sort -V | head -1)" = "26.4" ]; then
              continue
            fi
            if [ -z "$pick_v" ] || [ "$(printf '%s\n%s\n' "$pick_v" "$v" | sort -V | tail -1)" = "$v" ]; then
              pick="$app"
              pick_v="$v"
            fi
          done
          if [ -n "$pick" ]; then
            echo "DEVELOPER_DIR=$pick/Contents/Developer" >> "$GITHUB_ENV"
            echo "using Xcode $pick_v"
          else
            echo "::warning::no Xcode below 26.4 on this image; the zig link may fail"
          fi
          echo "default xcode: $(xcodebuild -version 2>/dev/null | head -1)"

      - run: cargo build --release --workspace --locked

      - run: cargo test --release --workspace --locked

      # Advisory, as RELEASING.md says. It reports and never blocks.
      - run: cargo clippy --release --workspace --locked
        continue-on-error: true

      # The Windows installer cannot be parsed anywhere else in the pipeline,
      # and it is the first thing a new user on Windows runs.
      - name: install.ps1 parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            foreach ($e in $errors) {
              Write-Output "line $($e.Extent.StartLineNumber): $($e.Message)"
            }
            exit 1
          }
          Write-Output "install.ps1 parses, $($tokens.Count) tokens"
