name: platforms

# The platforms we ship and do not develop on, at the cadence they are worth.
#
# `ci.yml` gates every push on x86-64 Linux, because that is where a defect is
# found per minute of runner time. This workflow answers the other question,
# which is whether the tree still builds and passes on macOS, on Windows, on
# Windows on ARM and on ARM Linux, which is a different code generator against
# the same libraries. It runs:
#
#   - on every push to main, as the quick subset described below, so a
#     platform break is attached to the commit that caused it
#   - on every release tag, in full, because a platform break must never reach
#     a user
#   - nightly, in full, so the worst case is one day of main being broken on a
#     platform rather than one release cycle
#   - on any change that touches platform-conditional code, the vendored
#     webview, a build script, or an installer, which is where the breaks
#     historically are
#   - on demand
#
# The nightly run is what makes the path filter safe. A filter can only list
# the places a platform break is likely, and a break that arrives somewhere
# else is caught within a day rather than at the next release.
#
# ## Why a subset on main, and what the subset does not catch
#
# Two Windows-only defects shipped in one week and were found hours later by
# the nightly run: an exit code from `vitrum icons` that differed from every
# other platform, and a test whose deadline only blows there. Both are the
# kind of thing a push should answer, and neither is worth a full release
# matrix per commit: this repository intends more than ten releases a day, a
# cold release build here is budgeted at an hour, and macOS bills at ten times
# the rate of Linux with five concurrent macOS jobs available. A full matrix
# on every push would spend most of that allowance queueing behind itself.
#
# So a push to main runs the same legs with the release profile, clippy and
# the installer parse removed, and bounds each runner at thirty minutes
# instead of sixty, on a dev-profile build rather than an optimised one.
#
# What the subset does not catch, and the nightly and tag runs do:
#
#   - anything that only appears with optimisations: a codegen difference, a
#     miscompile, and any test whose timing changes between profiles. A
#     deadline that holds in dev can still blow in release, and one that blows
#     in dev can hold in release, so a deadline failure here is a signal about
#     that profile and not about the shipped binary.
#   - anything gated on `debug_assertions`, which is on here and off in a
#     release, including arithmetic overflow checks.
#   - clippy on macOS, Windows and ARM. It is advisory everywhere and never
#     blocks, so it is the first thing a subset drops.
#   - `install.ps1` parsing, which nothing else in this pipeline can do. A
#     change to that file matches the pull-request path filter above and gets
#     the full run.
#   - the release archive itself. Nothing here packages, and the CPU floor is
#     gated in `release.yml` on the binaries a user receives.
#
# A pull request still gets the full run when it touches a path above, and the
# answer for anything else arrives when it merges rather than while it is open.
on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # Early morning UTC, when nothing else is queued.
    - cron: "0 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      # Platform-conditional code and the things that decide how it is built.
      - "**/build.rs"
      - "vendor/**"
      - "vendor-pty/**"
      - "crates/vitrum-vt/**"
      - "packaging/**"
      - "install.sh"
      - "install.ps1"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/platforms.yml"
      - ".github/actions/**"

# The token this run carries. Nothing here writes to the repository: it builds,
# tests and reads. A default-write token in a job that only needs to read is a
# credential handed to every dependency the build downloads.
permissions:
  contents: read

concurrency:
  group: platforms-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Which cadence this run is, decided once. A push to main is the quick
  # subset; a tag push, the schedule, a dispatch and a pull request are the
  # full run. Every step below reads this rather than restating the condition.
  QUICK: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A cold Windows build is the long pole in the full run. The quick subset
    # compiles no optimised code and gets half the budget, so a leg that hangs
    # frees its runner before the next push needs it. The condition is spelled
    # out because `timeout-minutes` cannot read the `env` context.
    timeout-minutes: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 30 || 60 }}
    strategy:
      # Which platform broke is the useful part of the answer, so one failing
      # must not cancel the other.
      fail-fast: false
      matrix:
        # Windows on ARM is here before it is published. Nothing in the tree
        # has ever been compiled for `aarch64-pc-windows-msvc`: the terminal
        # engine is built from Zig source, the pty layer is vendored C, and
        # the webview is a different runtime build, so whether that target
        # builds at all is a question with no answer yet. It gets one on every
        # push, and a release leg follows only once these are green.
        os: [macos-latest, windows-latest, windows-11-arm, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy

      # One cache per platform per profile. A dev build and a release build of
      # the same tree share almost no artifacts, so a single key would have the
      # two cadences overwriting each other's cache on every run.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ env.QUICK == 'true' && 'quick' || 'full' }}

      # ARM Linux is Linux: it links the same system webview, and the image
      # does not ship it.
      - name: system webview
        if: runner.os == 'Linux'
        run: ./.github/system-webview.sh

      # The terminal engine is built from Ghostty source by `vitrum-vt`, whose
      # default `vendored` route needs Zig. The version is the one Ghostty
      # pins: a newer Zig fails Ghostty's own build-version check, so this is
      # not a floating "latest".
      - name: zig toolchain
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          # On a runner we own the cache is kept below, so uploading it to
          # GitHub's cache service costs a post-step and buys nothing.
          use-cache: ${{ runner.environment == 'github-hosted' }}

      # setup-zig puts both zig cache directories inside the workspace, which
      # checkout wipes at the start of every run. On our own runner point them
      # somewhere that survives instead, so the cache is warm without a
      # download and without a 200s upload afterwards.
      - name: durable zig cache
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          dir="$HOME/.cache/zig-vitrum"
          mkdir -p "$dir"
          echo "ZIG_GLOBAL_CACHE_DIR=$dir" >> "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=$dir" >> "$GITHUB_ENV"

      # Zig cannot link against the Xcode 26.4 SDK: ziglang/zig#31658, fixed
      # upstream for 0.16. Against that SDK every libSystem symbol comes back
      # undefined (`_abort`, `_bzero`, `__availability_version_check`) while
      # Ghostty's shared library is linked, and the vt engine never builds.
      #
      # The newest Xcode below 26.4 is selected rather than a pinned one, so a
      # runner image that drops the exact version we named still builds. When
      # Zig 0.16 lands, delete this whole step: nothing else depends on it.
      - name: xcode zig can link against
        if: runner.os == 'macOS'
        run: |
          echo "installed: $(ls -d /Applications/Xcode_*.app 2>/dev/null | tr '\n' ' ')"
          pick=""
          pick_v=""
          for app in /Applications/Xcode_*.app; do
            v="${app#/Applications/Xcode_}"
            v="${v%.app}"
            # 26.4 and newer carry the SDK that breaks the link.
            if [ "$(printf '%s\n26.4\n' "$v" | sort -V | head -1)" = "26.4" ]; then
              continue
            fi
            if [ -z "$pick_v" ] || [ "$(printf '%s\n%s\n' "$pick_v" "$v" | sort -V | tail -1)" = "$v" ]; then
              pick="$app"
              pick_v="$v"
            fi
          done
          if [ -n "$pick" ]; then
            echo "DEVELOPER_DIR=$pick/Contents/Developer" >> "$GITHUB_ENV"
            echo "using Xcode $pick_v"
          else
            echo "::warning::no Xcode below 26.4 on this image; the zig link may fail"
          fi
          echo "default xcode: $(xcodebuild -version 2>/dev/null | head -1)"

      # The full run, on a tag, on the schedule, on a dispatch and on a pull
      # request that touches a platform path. This is the profile a user
      # receives, so it is the one a release is allowed to depend on.
      - name: build and test, release profile
        if: env.QUICK != 'true'
        run: |
          cargo build --release --workspace --locked
          cargo test --release --workspace --locked

      # The quick subset, on every push to main. One command: a dev-profile
      # test build compiles and runs everything a release-profile one does,
      # in less time and without optimising code no user will run today. It
      # answers the question this cadence exists for, which is whether the
      # tree still behaves on a platform nobody here develops on.
      - name: test, dev profile
        if: env.QUICK == 'true'
        run: cargo test --workspace --locked

      # Advisory, as RELEASING.md says. It reports and never blocks, which is
      # why the subset drops it rather than running it three more times a day.
      - name: clippy
        if: env.QUICK != 'true'
        run: cargo clippy --release --workspace --locked
        continue-on-error: true

      # The Windows installer cannot be parsed anywhere else in the pipeline,
      # and it is the first thing a new user on Windows runs. A change to it
      # matches the path filter above, so the subset does not need to repeat
      # this on pushes that cannot have touched it.
      - name: install.ps1 parses
        if: runner.os == 'Windows' && env.QUICK != 'true'
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            foreach ($e in $errors) {
              Write-Output "line $($e.Extent.StartLineNumber): $($e.Message)"
            }
            exit 1
          }
          Write-Output "install.ps1 parses, $($tokens.Count) tokens"
