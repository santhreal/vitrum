name: publish

# Publishes every crate to crates.io when a `v*` tag is pushed.
#
# The two forks, `vitrum-dioxus-desktop` and `vitrum-portable-pty`, come first
# and `vitrum` (the client) is last, and all of that is on purpose. A fork exists
# because `[patch.crates-io]` is ignored by anyone installing from the registry,
# so publishing a crate without publishing the fork it depends on would fail to
# resolve, and publishing a fork without its consumer would leave the whole
# rename pointless.
#
# Order is not cosmetic: cargo resolves each crate's dependencies from the
# registry at publish time, so a crate whose dependency is not up there yet is
# rejected. The list below is a topological sort of the internal graph, and a
# step waits for the index to serve what the previous one uploaded.
#
# `--no-verify` is deliberately NOT used. A crate that does not build from its
# own packaged tarball is broken for everyone who installs it, and that is
# exactly the failure this job exists to catch before a user does.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: package and verify without uploading
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  crates:
    runs-on: ubuntu-latest
    # Thirteen crates, each waiting on the index to catch up. Generous, and
    # still short of a runner held all day by a registry that stopped
    # answering.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: system webview
        run: ./.github/system-webview.sh

      # `vitrum-vt` builds the Ghostty engine from source when it is packaged.
      - name: zig toolchain
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          # On a runner we own the cache is kept below, so uploading it to
          # GitHub's cache service costs a post-step and buys nothing.
          use-cache: ${{ runner.environment == 'github-hosted' }}

      # setup-zig puts both zig cache directories inside the workspace, which
      # checkout wipes at the start of every run. On our own runner point them
      # somewhere that survives instead, so the cache is warm without a
      # download and without a 200s upload afterwards.
      - name: durable zig cache
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          dir="$HOME/.cache/zig-vitrum"
          mkdir -p "$dir"
          echo "ZIG_GLOBAL_CACHE_DIR=$dir" >> "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=$dir" >> "$GITHUB_ENV"

      # A tag whose version does not match the workspace would publish the old
      # version under a new tag and there is no way to take it back.
      - name: the tag must match the workspace version
        if: github.event_name == 'push'
        run: |
          declared=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="${GITHUB_REF_NAME#v}"
          test "$declared" = "$tag" || {
            echo "tag $tag against workspace version $declared"; exit 1; }

      - name: dry run
        if: inputs.dry_run
        run: |
          for c in vitrum-dioxus-desktop vitrum-portable-pty vitrum-proto \
                   vitrum-fmt vitrum-search vitrum-grid vitrum-vt vitrum-model \
                   vitrum-os vitrum-core vitrum-server vitrum-replay vitrum; do
            cargo package -p "$c" --allow-dirty
          done

      - name: publish
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for c in vitrum-dioxus-desktop vitrum-portable-pty vitrum-proto \
                   vitrum-fmt vitrum-search vitrum-grid vitrum-vt vitrum-model \
                   vitrum-os vitrum-core vitrum-server vitrum-replay vitrum; do
            # Already at this version: a re-run after a partial failure must
            # finish the list rather than stop on the crates that succeeded.
            if cargo publish -p "$c" 2>&1 | tee /tmp/out; then
              echo "published $c"
            elif grep -q "already exists" /tmp/out; then
              echo "$c is already at this version"
            else
              exit 1
            fi
            # The index is eventually consistent; the next crate resolves this
            # one from it.
            sleep 30
          done
