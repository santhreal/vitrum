# A fork of `portable-pty` 0.9.0, vendored rather than patched.
#
# It is a real, named dependency because `[patch.crates-io]` is ignored by
# anyone installing `vitrum` from a registry: a published client would have
# built against upstream and hung a share of its Windows sessions before the
# child ever ran. See README.md for the single divergence and when this goes
# away.

[package]
name = "vitrum-portable-pty"
version = "0.9.0"
authors = ["Wez Furlong"]
edition = "2018"
repository = "https://github.com/santhreal/vitrum"
description = "Cross platform pty interface, forked for vitrum so a headless daemon is never asked to report a cursor it does not have."
license = "MIT"

# The import path stays `portable_pty`, because the divergence is four bytes of
# behaviour and renaming every use site would hide that.
[lib]
name = "portable_pty"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
downcast-rs = "1.0"
filedescriptor = "0.8.3"
log = "0.4"
libc = "0.2"
nix = { version = "0.28", features = ["term", "fs"] }
shell-words = "1.1"
serde_derive = { version = "1.0", optional = true }
serde = { version = "1.0", optional = true }
serial2 = "0.2"

[features]
default = []
serde_support = ["serde", "serde_derive"]

[target."cfg(windows)".dependencies]
bitflags = "1.3"
lazy_static = "1.4"
shared_library = "0.1"
winapi = { version = "0.3", features = [
    "winuser",
    "consoleapi",
    "handleapi",
    "fileapi",
    "namedpipeapi",
    "synchapi",
] }
winreg = "0.10"
