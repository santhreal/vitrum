[package]
name = "vitrum"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The vitrum desktop client: sidebar and terminal panes."

# The package and the binary are both `vitrum`, so there is no `[[bin]]` here:
# `src/main.rs` in a package named `vitrum` already produces `vitrum`.
#
# It was `vitrum-app` for both. `--help` has always said `usage: vitrum`, every
# error message names `vitrum`, and the README tells you to type `vitrum`, so
# the old name made all of those wrong the moment anybody followed them. The
# registry entry is `vitrum` for the same reason: `cargo install vitrum` should
# install the thing this product is called. The daemon is located beside the
# executable or on PATH by its own name, so none of this touches it.

[dependencies]
vitrum-proto = { workspace = true }
vitrum-fmt = { workspace = true }
vitrum-model = { workspace = true }
vitrum-os = { workspace = true }
# No `desktop` feature: that would pull the registry's `dioxus-desktop` in
# beside the fork below, and two renderers in one graph compile and then fail
# at runtime on trait mismatches.
dioxus = "0.7"

# The renderer, forked. Upstream builds a fresh `WebContext` per webview, and
# on Linux each one starts its own `WebKitNetworkProcess`: measured here, 20
# windows ran 20 of them at 8.6 MB PSS each, so 171.2 MB went on twenty copies
# of one cache and cookie jar. That is the entire gap between the measured
# 1138.2 MB and this product's stated 1 GB target for 20 windows.
#
# It is a dependency rather than a `[patch.crates-io]` because a patch applies
# only to a workspace build. Anyone running `cargo install vitrum` would have
# resolved upstream and got the per-window process behaviour with nothing
# saying so.
#
# Sharing one leaked WebContext was tried and REVERTED. Two independent
# blockers, both confirmed by reading dioxus-desktop 0.7.10 rather than
# guessed:
#
# 1. It panics on the second window with `DuplicateCustomProtocol("dioxus")`.
#    wry registers custom protocols per WebContext, so one context accepts the
#    handler exactly once.
#
# 2. Registering the protocol only ONCE is not a fix, and this is the decisive
#    one. `protocol.rs::module_loader` inlines `edit_state.wry_queue`'s
#    `edits_path` and `required_server_key` into the index.html it serves, so
#    every webview's page is wired to ITS OWN edit stream. A single shared
#    handler would hand window 2 a document pointing at window 1's queue, and
#    `__events` would dispatch window 2's DOM events into window 1's
#    VirtualDom. That is cross-window corruption, far worse than the memory it
#    saves.
#
# Routing by `WebViewId` cannot rescue it locally either: `desktop_handler`
# receives the id, but the index request is the FIRST thing a new webview asks
# for, and the id is not known to the caller until `build()` has returned. The
# fix belongs upstream, where the registration and the id can be ordered.
#
# Measured consequence: 55.1 MB per window, of which 9.1 MB is this. Fifteen
# windows fit in 1 GB; twenty are 1263.9 MB. Even with this recovered, twenty
# would be ~1090 MB, so it is necessary and NOT sufficient. See GOAL.md.
vitrum-dioxus-desktop = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# `time` only: the one-shot that retires a transient notice. The runtime
# itself is dioxus-desktop's; nothing here starts one.
tokio = { version = "1", default-features = false, features = ["time"] }
anyhow = { workspace = true }
ureq = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }

# Reached only through `tao::platform::unix::MonitorHandleExtUnix::gdk_monitor`,
# which hands back a `gtk::gdk::Monitor` whose `width_mm`/`height_mm` are the
# only interface on X11 that knows a panel's physical size. tao reports a scale
# factor of 1.0 for both a 82 dpi and a 163 dpi monitor on a session with
# `GDK_SCALE` unset, so without this the HiDPI detection has no signal to read.
# Already in the lockfile via wry, so this costs no extra compilation.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Server-side rendering, tests only. The search module had 25 green tests that
# exercised pure functions and stylesheet text, and not one of them built the
# markup: a panic in the RSX, or a highlight computed correctly and then
# dropped by the markup, would have passed every one. These render the real
# component and assert on the HTML, which is where the byte-offset claim
# actually has to hold. Pinned with `=` to the dioxus version already in the
# lockfile so it moves nothing.
[dev-dependencies]
dioxus-ssr = "=0.7.10"
