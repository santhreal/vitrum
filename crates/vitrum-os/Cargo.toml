[package]
name = "vitrum-os"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Cross-platform desktop integration: notifications, badge, tray, single instance, theme, window state, deep links, and per-OS paths."
readme = "README.md"
rust-version = "1.85"
keywords = ["notifications", "tray", "badge", "single-instance", "desktop"]
categories = ["os", "gui", "api-bindings"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
vitrum-proto = { workspace = true }

[target.'cfg(unix)'.dependencies]
# flock(2) without a libc shim. `fs` covers the lock, `process` covers getpid
# for the stale-lock report.
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }
# localtime_r for the local UTC offset. `std` has no local-time conversion and
# a date-time crate would be a large dependency for one `tm_gmtoff` read.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Notifications, Unity LauncherEntry, and portal Settings all ride the session
# bus. `blocking-api` keeps this crate usable from a non-async caller; the
# async-io reactor is zbus's own thread, not the host's runtime.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# StatusNotifierItem + com.canonical.dbusmenu over the same zbus, no GTK.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSDictionary",
    "NSError",
    "NSBundle",
    "NSDistributedNotificationCenter",
    "NSNotification",
    "NSOperation",
    "NSValue",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSDockTile",
    "NSResponder",
    "NSAppearance",
] }
objc2-user-notifications = { version = "0.3", features = [
    "UNUserNotificationCenter",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationTrigger",
    "UNNotificationSound",
    "block2",
] }
block2 = "0.6"
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.24", default-features = false }
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
parking_lot = "0.12"
