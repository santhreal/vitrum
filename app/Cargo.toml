[package]
name = "vitrum"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The vitrum desktop client: sidebar and terminal panes."
rust-version = "1.90"
keywords = ["terminal", "agents", "sessions", "pty", "desktop"]
categories = ["command-line-utilities", "development-tools", "gui"]

# The package and the binary are both `vitrum`, so there is no `[[bin]]` here:
# `src/main.rs` in a package named `vitrum` already produces `vitrum`.
#
# It was `vitrum-app` for both. `--help` has always said `usage: vitrum`, every
# error message names `vitrum`, and the README tells you to type `vitrum`, so
# the old name made all of those wrong the moment anybody followed them. The
# daemon is located beside the executable or on PATH by its own name, so none
# of this touches it.

[dependencies]
vitrum-proto = { workspace = true }
vitrum-fmt = { workspace = true }
vitrum-model = { workspace = true }
vitrum-os = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The session socket lives in this process, so the client needs the same
# runtime pieces the daemon does: `net` and `io-util` for the TCP stream under
# the WebSocket, `rt` and `sync` for the task that owns it and the channels it
# talks to the UI thread over, `macros` for the select in that task's loop, and
# `time` for the one-shot that retires a transient notice. `rt-multi-thread`
# because the shell builds the runtime itself, in `shell::run`, and the socket
# has to keep reading while the GTK main loop is between frames on the UI
# thread.
tokio = { version = "1", default-features = false, features = [
    "time",
    "rt",
    "rt-multi-thread",
    "sync",
    "macros",
    "net",
    "io-util",
] }
# The client half of the same WebSocket implementation the daemon serves with,
# so there is one framing, one close-code vocabulary and one ping answerer
# across both ends rather than a browser's and a crate's.
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
anyhow = { workspace = true }
ureq = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }

# The terminal pane. Not optional and not behind a feature: it is the only
# pane this product has. A session's bytes are parsed by libghostty's VT in
# `vitrum-vt`, kept in a `vitrum-grid` cell grid and painted by wgpu onto a
# native surface. The product shipped a JavaScript emulator in a webview once;
# that cost a second escape-sequence parser, a working directory and prompt
# boundary held where no Rust could read them, and a frame budget owned by a
# DOM layout pass.
#
# `wgpu` is pinned to the version `vitrum-grid` uses, so one device and one set
# of types cross the boundary.
vitrum-grid = { workspace = true }
# The emulator the pane hosts. One escape-sequence parser in the product, and
# this is where a session's bytes meet it.
vitrum-vt = { workspace = true }
# The same matcher the daemon's cross-session search compiles. In-pane find and
# the daemon have to agree on what a match is, and two implementations of that
# question disagree the first time either one is changed.
vitrum-search = { workspace = true }
wgpu = { version = "29", default-features = false, features = [
    "std",
    "vulkan",
    "gles",
    "wgsl",
] }
pollster = { version = "1.0" }
# The settings bus and the coalescing preferences writer each hold a lock and a
# condition variable. `std`'s poison every call site into an
# `unwrap_or_else(PoisonError::into_inner)`, because a listener that panics must
# not take every later settings change down with it; parking_lot does not
# poison, so that path stops existing rather than being handled at each caller.
# wgpu already pulls this in through `vitrum-grid`, so it adds no new tree.
parking_lot = "0.12"

# GTK is the window. The toplevel, the paned the operator drags, the sidebar,
# the titlebar and the bar under the terminal are all widgets, and the pane's
# drawing area is one more. It is not target-gated because there is no second
# window implementation to gate it against: a build without GTK has no
# interface at all.
#
# GTK3 and not GTK4, because the pane presents a wgpu swapchain on the drawing
# area's OWN native subwindow and GTK4 removed native subwindows.
#
# `gdk` also carries the only interface on X11 that knows a panel's physical
# size, `Monitor::width_mm` and `height_mm`, which is the signal the HiDPI
# detection reads: the toolkit reports a scale factor of 1.0 for both a 82 dpi
# and a 163 dpi monitor on a session with `GDK_SCALE` unset. gdk and glib are
# the versions gtk 0.18 re-exports, so they add two crate names and no new
# compilation.
gtk = "0.18"
gdk = "0.18"
glib = "0.18"

[dev-dependencies]
saphyr = "0.0.11"

# The resource compiler that puts the mark inside the `.exe`, and the crate
# that draws it. Only Windows builds run either: on every other target
# `build.rs` writes the target triple and stops.
[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"
vitrum-os = { workspace = true }
