name: publish

# Publishes the library crates to crates.io when a `v*` tag is pushed.
#
# Order is not cosmetic: cargo resolves each crate's dependencies from the
# registry at publish time, so a crate whose dependency is not up there yet is
# rejected. The list below is a topological sort of the internal graph, and a
# step waits for the index to serve what the previous one uploaded.
#
# `--no-verify` is deliberately NOT used. A crate that does not build from its
# own packaged tarball is broken for everyone who installs it, and that is
# exactly the failure this job exists to catch before a user does.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: package and verify without uploading
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: system webview
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # A tag whose version does not match the workspace would publish the old
      # version under a new tag and there is no way to take it back.
      - name: the tag must match the workspace version
        if: github.event_name == 'push'
        run: |
          declared=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="${GITHUB_REF_NAME#v}"
          test "$declared" = "$tag" || {
            echo "tag $tag against workspace version $declared"; exit 1; }

      - name: dry run
        if: inputs.dry_run
        run: |
          for c in vitrum-proto vitrum-fmt vitrum-search vitrum-grid \
                   vitrum-model vitrum-os vitrum-core vitrum-server \
                   vitrum-replay; do
            cargo package -p "$c" --allow-dirty
          done

      - name: publish
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for c in vitrum-proto vitrum-fmt vitrum-search vitrum-grid \
                   vitrum-model vitrum-os vitrum-core vitrum-server \
                   vitrum-replay; do
            # Already at this version: a re-run after a partial failure must
            # finish the list rather than stop on the crates that succeeded.
            if cargo publish -p "$c" 2>&1 | tee /tmp/out; then
              echo "published $c"
            elif grep -q "already exists" /tmp/out; then
              echo "$c is already at this version"
            else
              exit 1
            fi
            # The index is eventually consistent; the next crate resolves this
            # one from it.
            sleep 30
          done
