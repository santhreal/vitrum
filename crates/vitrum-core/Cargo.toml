[package]
name = "vitrum-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "PTY hosting and bounded scrollback for vitrum sessions."

[dependencies]
vitrum-proto = { workspace = true }
# Head parsing. `strip_ref_prefix` and `short_commit` are the same rules the
# sidebar formats with, and a second copy here drifted from them once already.
vitrum-fmt = { workspace = true }
# The OSC 7373 hint parser lives here. Scanning the PTY stream for a harness
# declaration needs exactly the parser the client already trusts, and a second
# implementation on the daemon side would be a second set of bugs.
vitrum-model = { workspace = true }
# The terminal engine. The daemon parses its own sessions' output because it
# has to know what a session is doing with no GUI attached at all, which is
# also why this cannot live in the client.
vitrum-vt = { workspace = true }
portable-pty = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
bytes = "1"

[target.'cfg(unix)'.dependencies]
# Two things need it. macOS reads thread state through proc_pidinfo, the only
# public way to ask what a process's threads are doing; Linux needs no shim
# there, because tcgetpgrp comes from portable-pty and the answer comes out of
# /proc. Every unix needs `kill`, because portable-pty's cloned killer sends
# SIGHUP and offers no way to send anything else.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job objects. Killing a session's child leaves its children running, because a
# Windows process is not the parent of anything the kernel tracks. The child is
# put in a job at spawn and the job is closed at session close, which is the
# only mechanism that reaches a grandchild. Already in the dependency graph at
# this version through tokio, so it costs no new build.
windows-sys = { version = "0.61", features = [
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[features]
# The host-capability checks in `test_support`, for the test builds of other
# crates. Off by default, so a shipped binary never carries them.
test-support = []

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
