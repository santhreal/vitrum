name: ci

# Every push and every pull request, on Linux only.
#
# macOS and Windows moved to `platforms.yml`, which runs them nightly, on every
# release, and on any change that can plausibly break a platform. Running a
# three-way matrix on every push cost three runners to answer a question that
# almost always has the same answer, and the queue for those runners was the
# slowest part of merging anything. What is left here is the gate that actually
# catches things: a Linux build with warnings fatal, the full test run, and a
# compile check against macOS that needs no mac.
#
# These are the gates RELEASING.md names, in the same order.
on:
  push:
    branches: [main]
  pull_request:

# A pull request that is pushed to twice must not hold two full matrices. The
# older run is cancelled, because nobody reads a verdict on a commit that has
# been replaced, and the runners it holds are what the next push waits for. A
# queued job that waits too long is cancelled by GitHub with no steps and no
# reason, which reads as a broken pipeline rather than a busy one.
#
# Pushes to main group by run id, so they never cancel each other: those
# verdicts are the release history and each commit keeps its own.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

# Which runner, and why the label is a variable rather than a literal.
#
# A pull request from a fork runs on a GitHub runner. A self-hosted runner
# executes whatever the workflow says, on hardware we own, and on a public
# repository anyone can open a pull request. Same-repository changes are ours;
# forks get the hosted runner and are none the worse for it.
#
# The label for our own hardware comes from the `CI_RUNNER` repository
# variable, and an unset variable means `ubuntu-latest`. It was the literal
# `vitrum` before, and no runner was ever registered under that label, so six
# of the seven jobs below asked for a machine that does not exist. They sat in
# `queued` until GitHub discarded them a day later with no steps and no reason
# — the exact failure the note above calls "a broken pipeline rather than a
# busy one", except that here it was every push rather than a contended queue.
# `ci` therefore never reported once. The single job that did run on every
# push is `release machinery`, and the only thing separating it from the other
# six is that it names a hosted runner.
#
# A label is a claim that some machine answers to it, and no expression in a
# workflow can check that claim. So the default is the runner that is always
# there: the worst case becomes a slower build instead of a pipeline that is
# silently never green, and adopting owned hardware is one variable away.
env:
  CARGO_TERM_COLOR: always
  # A warning is a failure. The crate ships with none and the only way it stays
  # that way is a machine refusing the push that adds one.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: linux
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    # Long enough for a cold build, short enough that a hung job frees its
    # runner the same morning instead of holding it for the six-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/runner-hygiene

      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy

      # Only on a hosted runner. A runner we own keeps its cargo home and its
      # registry between runs, so uploading a multi-gigabyte cache to GitHub
      # and pulling it back would be slower than the build it saves.
      #
      # It does NOT keep its target directory: `actions/checkout` cleans the
      # workspace and logs `Removing target/` on every job, so each build here
      # is cold. Caching would not fix that either, because the cache is keyed
      # on the lockfile and restoring one is the download this skips. Making
      # the rig warm means keeping the target directory out of the workspace
      # checkout deletes, which is a decision about the machine rather than
      # about this file.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: linux

      # The client links the system webview. On Ubuntu that is WebKitGTK, and
      # nothing in the runner image provides it. The script returns immediately
      # when the packages are already there, which is the normal case on a
      # self-hosted runner.
      - name: system webview
        run: ./.github/system-webview.sh

      # The terminal engine is built from Ghostty source by `vitrum-vt`, whose
      # default `vendored` route needs Zig. The version is the one Ghostty
      # pins: a newer Zig fails Ghostty's own build-version check, so this is
      # not a floating "latest".
      - name: zig toolchain
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          # On a runner we own the cache is kept below, so uploading it to
          # GitHub's cache service costs a post-step and buys nothing.
          use-cache: ${{ runner.environment == 'github-hosted' }}

      # setup-zig puts both zig cache directories inside the workspace, which
      # checkout wipes at the start of every run. On our own runner point them
      # somewhere that survives instead, so the cache is warm without a
      # download and without a 200s upload afterwards.
      - name: durable zig cache
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          dir="$HOME/.cache/zig-vitrum"
          mkdir -p "$dir"
          echo "ZIG_GLOBAL_CACHE_DIR=$dir" >> "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=$dir" >> "$GITHUB_ENV"

      - run: cargo build --release --workspace --locked

      # What the kernel will let the waiting-probe see, printed because the
      # suite cannot say it. The probe reads /proc/<pid>/syscall, which needs
      # ptrace attach permission, and where that is denied eighteen tests skip
      # themselves. libtest captures their reason, so without this line a run
      # is green and silent about what it did not check. This reports the
      # host's setting; the decision to skip stays in the tests.
      #
      # `read` and not `cat`: the redirection for a builtin is performed by the
      # shell itself, which is the child's parent. `cat` is the child's sibling,
      # and yama denies a sibling at scope 1 as well as at scope 2, so a check
      # written with it reports a healthy host as broken. Measured on this
      # runner: at scope 1 the parent reads and the sibling does not; at scope 2
      # neither does. The test helper reads its own child the same way.
      - name: probe capability
        run: |
          sleep 30 & p=$!
          scope=$(cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null || echo "n/a")
          if read -r _ < /proc/$p/syscall 2>/dev/null; then
            echo "kernel answers the waiting probe (yama ptrace_scope=$scope)"
          else
            echo "::warning::this kernel denies /proc/<pid>/syscall (yama" \
              "ptrace_scope=$scope), so the waiting-probe tests skip themselves." \
              "Set kernel.yama.ptrace_scope=1 on this runner to restore them."
          fi
          kill $p 2>/dev/null || true

      - run: cargo test --release --workspace --locked

      # Advisory, as RELEASING.md says. It reports and never blocks.
      - run: cargo clippy --release --workspace --locked
        continue-on-error: true

      # The installers are the first thing a new user runs, and nothing else in
      # the build reads them. Each is checked on the platform that owns it: a
      # syntax error in either ships silently otherwise, and the Windows one
      # cannot be parsed anywhere else in this pipeline.
      - name: install.sh parses
        run: sh -n install.sh

  # What is in the pictures, on every pull request.
  #
  # The suite in `app/src/tests/assets.rs` enumerates every picture in the tree
  # and reads every description of one: an asset no document shows fails, and a
  # description written in shell vocabulary fails. Both are review gates
  # AGENTS.md states and a reviewer has already missed once.
  #
  # Its own job, and not a line in the run above, because the verdict is for a
  # different reader. A pull request that adds a screenshot wants one check
  # named `assets` going red beside the diff, not a failure buried in a
  # workspace test log; and this one is over in the time it takes to link the
  # client, because it runs those tests and nothing else.
  assets:
    name: assets
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/runner-hygiene
      - uses: ./.github/actions/rust-toolchain
      # The same key as the build job: this compiles the same crate with the
      # same flags, so a second cache would be a second copy of it.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: linux

      # The gate lives in the client binary, and the client links the system
      # webview, so this job needs the same two prerequisites the build does.
      - name: system webview
        run: ./.github/system-webview.sh

      - name: zig toolchain
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: ${{ runner.environment == 'github-hosted' }}

      - name: durable zig cache
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          dir="$HOME/.cache/zig-vitrum"
          mkdir -p "$dir"
          echo "ZIG_GLOBAL_CACHE_DIR=$dir" >> "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=$dir" >> "$GITHUB_ENV"

      # `--bin vitrum` because the client crate has no library target, and the
      # module path because a green `assets` must mean the asset gate ran.
      - run: "cargo test --release -p vitrum --bin vitrum --locked assets::"

  # The release machinery, on every push, because the day it is needed is a
  # day nobody wants to debug it. None of this builds the workspace: it reads
  # manifests, rehearses a cut in a throwaway clone and throws the clone away.
  release:
    name: release machinery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A dry run clones this checkout and cuts a release inside the clone, so
      # it needs the history the clone will carry.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: release

      - name: the release scripts parse
        run: for f in tools/release/*.sh packaging/*.sh; do sh -n "$f"; done

      # The gate that decides whether a release ships. Both times it was wrong
      # it was wrong on a runner nobody can attach to, after a forty-minute
      # build: once skipping every Mach-O binary, once failing arm64 on four
      # bytes of literal pool that decoded as an SVE instruction. Neither
      # needed a real binary to catch, only a disassembler saying those words.
      - name: the instruction-set gate holds its fixtures
        run: ./tools/release/check-isa-test.sh

      # Its sibling, and the same lesson twice over. The ABI gate died on the
      # macOS legs because it demanded a readelf before it knew whether there
      # was an ELF, so a build that had already succeeded published nothing;
      # and a READELF naming a binary that does not exist made it report every
      # archive clean. Both are a stub saying those words, not a real binary.
      - name: the abi gate holds its fixtures
        run: ./tools/release/check-abi-test.sh

      # The version literal lives in 23 places and the published target set in
      # three files. Both are checked here rather than discovered by the first
      # person to run an installer against a release.
      - name: every version literal and target triple agrees
        run: make release-check

      # The whole cut, in a scratch clone, asserted and unwound. It breaks a
      # version site at a time inside the clone and requires the check above to
      # catch each one, runs every refusal `cut.sh` owes, then fails if this
      # checkout is not byte-identical afterwards.
      - name: a release cut rehearses cleanly
        run: make release-dry-run VERSION="$(tools/release/versions.sh current)"

      # Each vendored fork is only as honest as its UPSTREAM.toml. This fails
      # on a change made to a fork without recording it, on a recorded
      # divergence that has become dead, and when upstream publishes a version
      # newer than the one a fork tracks.
      #
      # `vendor-ghostty-vt-sys` exists to keep a compiler from reading the
      # builder's CPU. An unrecorded edit there is how that pin gets lost, and
      # losing it ships a binary that dies with SIGILL on a class of machine
      # nobody here owns.
      - name: the vendored forks are exactly what they declare
        run: |
          sh tools/upstream/check.sh
          sh tools/upstream/check.sh --fork vendor-ghostty-vt-sys

      # Both ways this pipeline has stalled were a label no machine answers
      # to: `vitrum`, for a self-hosted runner that was never registered, and
      # `macos-13`, for an image GitHub retired. Neither fails. The job is
      # accepted, queued, and abandoned a day later with no steps and no
      # reason, so the repository looks busy rather than broken, and a release
      # matrix that cannot complete blocks the publish that needs it.
      #
      # Nothing at runtime catches this, because by the time a label is wrong
      # there is no runner to run the check on. So the labels are checked here
      # instead, from the one job that asks for a runner GitHub always has.
      #
      # The allowlist is the point rather than the labels in it: a new label
      # of any kind — a typo, a self-hosted name, a retired image, an image
      # that does not exist yet — is red until someone adds it deliberately.
      #
      # `vars.CI_RUNNER` is a repository setting rather than a file, so the
      # scan below cannot see it. It is passed in and held to the same list,
      # which catches the realistic failure — a variable set to a label nobody
      # registered, or misspelled — from a job on a runner GitHub always has.
      # What it still cannot prove is that a machine answering to that label
      # is online right now; only a job landing on one shows that.
      - name: every runner label is one a runner answers to
        env:
          CI_RUNNER: ${{ vars.CI_RUNNER }}
        run: |
          set -eu
          allowed=" ubuntu-latest macos-latest macos-15-intel windows-latest vitrum "

          # Three ways a label reaches a runner: a bare `runs-on` scalar, an
          # operand of `&&`/`||` in a `runs-on` expression (which is how the
          # fork ternary picks one), and a matrix `os:` value, in either the
          # inline-list or the one-per-entry form.
          labels=$(
            {
              grep -rhE '^[[:space:]]*runs-on:[[:space:]]*[A-Za-z0-9._-]+[[:space:]]*$' .github/workflows \
                | sed -E 's/.*runs-on:[[:space:]]*//; s/[[:space:]]*$//'
              grep -rhE '^[[:space:]]*runs-on:.*\$\{\{' .github/workflows \
                | grep -oE "(&&|\|\|)[[:space:]]*'[A-Za-z0-9._-]+'" \
                | grep -oE "'[A-Za-z0-9._-]+'" | tr -d "'"
              grep -rhE '^[[:space:]]*-?[[:space:]]*os:[[:space:]]*[A-Za-z0-9._-]+[[:space:]]*$' .github/workflows \
                | sed -E 's/.*os:[[:space:]]*//; s/[[:space:]]*$//'
              grep -rhE '^[[:space:]]*os:[[:space:]]*\[' .github/workflows \
                | sed -E 's/.*\[//; s/\].*//' | tr ',' '\n' | tr -d ' []'
            } | grep -v '^$' | sort -u
          )

          # A silent pass would also be the result of a broken matcher.
          test -n "$labels" || { echo "::error::no runner label was found at all, so this check proved nothing"; exit 1; }

          bad=0
          for label in $labels; do
            case "$allowed" in
              *" $label "*) echo "ok       $label" ;;
              *)
                echo "::error::runs-on names '$label', which is not a runner label this repository has agreed on. A label with no runner behind it does not fail the job, it queues it forever. Add it to the allowlist in this step if a runner really answers to it."
                bad=1
                ;;
            esac
          done

          # The variable, when the repository sets one. Unset is legal and is
          # the hosted fallback the expression already spells out.
          if [ -n "${CI_RUNNER:-}" ]; then
            case "$allowed" in
              *" $CI_RUNNER "*) echo "ok       $CI_RUNNER (CI_RUNNER)" ;;
              *)
                echo "::error::the CI_RUNNER repository variable is '$CI_RUNNER', which is not a label this repository has agreed on. Every job that reads it will queue forever rather than fail. Fix the variable, or add the label here once a runner answers to it."
                bad=1
                ;;
            esac
          else
            echo "ok       CI_RUNNER unset: jobs fall back to ubuntu-latest"
          fi

          exit $bad

  # What a mac would tell us about a compile error, without a mac.
  #
  # Nearly every way this workspace breaks on macOS is a compile error in
  # `cfg`-gated code, and that is answerable by a cross-target check on Linux
  # in about a minute. It is not a substitute for building and testing on a
  # real mac, which `platforms.yml` still does; it is what makes the case where
  # a mac is worth waiting for rare enough to schedule.
  macos-check:
    name: macos compiles
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/runner-hygiene
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: macos-check
      # `vitrum-core` depends on `vitrum-vt`, which builds the Ghostty engine
      # from source, so this needs Zig exactly as the build job does.
      - name: zig toolchain
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          # On a runner we own the cache is kept below, so uploading it to
          # GitHub's cache service costs a post-step and buys nothing.
          use-cache: ${{ runner.environment == 'github-hosted' }}

      # setup-zig puts both zig cache directories inside the workspace, which
      # checkout wipes at the start of every run. On our own runner point them
      # somewhere that survives instead, so the cache is warm without a
      # download and without a 200s upload afterwards.
      - name: durable zig cache
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          dir="$HOME/.cache/zig-vitrum"
          mkdir -p "$dir"
          echo "ZIG_GLOBAL_CACHE_DIR=$dir" >> "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=$dir" >> "$GITHUB_ENV"
      # `vitrum-core` is where the platform-conditional code lives. The client
      # crates link a system webview that has no cross-compilable form, so
      # checking them here would fail for a reason that says nothing about the
      # change.
      #
      # `--tests` is the point rather than a refinement: most of the gated code
      # in this crate is in its test modules, and without it this job passed a
      # commit whose macOS test build did not compile at all.
      - run: cargo check --release -p vitrum-core --target aarch64-apple-darwin --tests --locked

  # What a Windows box would tell us about a compile error, without a Windows
  # box, and for the same reason as the job above.
  #
  # Windows is the platform this workspace breaks on silently, because every
  # `unix` gate is a `not(windows)` gate stated the other way round and Linux
  # cannot see either. Two releases in a row were broken here by an import that
  # only Windows found unused, so this runs on every push instead of waiting
  # for a dispatch of `platforms.yml`.
  #
  # It targets the GNU ABI rather than MSVC, because MSVC needs headers that
  # cannot be had on Linux. The difference is `target_env`, which nothing in
  # this workspace gates on; `target_os` and `unix` are identical across the
  # two, and those are what the code actually asks about. The real MSVC build
  # still runs in `platforms.yml` before a release.
  windows-check:
    name: windows compiles
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/runner-hygiene
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: windows-check
      - name: zig toolchain
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          # On a runner we own the cache is kept below, so uploading it to
          # GitHub's cache service costs a post-step and buys nothing.
          use-cache: ${{ runner.environment == 'github-hosted' }}

      # setup-zig puts both zig cache directories inside the workspace, which
      # checkout wipes at the start of every run. On our own runner point them
      # somewhere that survives instead, so the cache is warm without a
      # download and without a 200s upload afterwards.
      - name: durable zig cache
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          dir="$HOME/.cache/zig-vitrum"
          mkdir -p "$dir"
          echo "ZIG_GLOBAL_CACHE_DIR=$dir" >> "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=$dir" >> "$GITHUB_ENV"
      # `--tests` is the whole point: the gated code that breaks Windows lives
      # in the test modules, so a check without it passes a workspace whose
      # test build does not compile.
      - run: cargo check --release --workspace --tests --target x86_64-pc-windows-gnu --locked
        env:
          CC_x86_64_pc_windows_gnu: ${{ github.workspace }}/.github/zig-cc-windows

  # Compiling for Windows is not running on Windows, and the difference is
  # where this project's oldest open defect lives. A Windows pseudoconsole does
  # not close its read side while the session holds the master, so the reader
  # cannot reach end of stream, `READER_REPORTS_EOF` is false there, and the
  # coalescer ends a session on a stopwatch after the exit. Whether that loses
  # a burst has never been observed, only reasoned about, because nobody
  # working on this has a Windows machine.
  #
  # A hosted Windows runner is one. This runs the session crate's own suite on
  # a real pseudoconsole, so the question stops being a comment and starts
  # being a result. It is scoped to `vitrum-core` rather than the workspace on
  # purpose: that is the crate whose behaviour is platform-dependent, and a job
  # that also fails for an unrelated reason answers nothing.
  windows-test:
    name: windows tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-test
      - name: zig toolchain
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      # This job was added to settle a burst-loss theory and settled two things
      # instead. 151 of 152 passed on a real pseudoconsole, including the
      # burst-after-exit case, so that theory is retired. The one failure was
      # the keyboard round trip, and it has not reproduced: unchanged, it now
      # passes in hundredths of a second. It failed as one of 152 tests sharing
      # a two-core runner and every pty here starts a pseudoconsole host, so the
      # deadline it blew looks like contention rather than a defect.
      #
      # It runs with everything else rather than in a quarantined step. A flake
      # nobody sees again is one nobody fixes, and the suite is where it will be
      # seen.
      - run: cargo test -p vitrum-core --locked

  # The archive the updater downloads is built by a script, and the script,
  # `update::archive_name` and both installers must agree on its name. This
  # builds it and then installs it with the shipped `install.sh` against a
  # local copy of the release, so a rename is caught here rather than by a user
  # whose update fails, and the digest refusal is exercised rather than assumed.
  package:
    name: release archive
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/runner-hygiene
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
          # The test job on this platform is the one that populates the cache.
          save-if: false
      - name: system webview
        run: ./.github/system-webview.sh
      - name: zig toolchain
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          # On a runner we own the cache is kept below, so uploading it to
          # GitHub's cache service costs a post-step and buys nothing.
          use-cache: ${{ runner.environment == 'github-hosted' }}

      # setup-zig puts both zig cache directories inside the workspace, which
      # checkout wipes at the start of every run. On our own runner point them
      # somewhere that survives instead, so the cache is warm without a
      # download and without a 200s upload afterwards.
      - name: durable zig cache
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          dir="$HOME/.cache/zig-vitrum"
          mkdir -p "$dir"
          echo "ZIG_GLOBAL_CACHE_DIR=$dir" >> "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=$dir" >> "$GITHUB_ENV"
      # The Linux archive is built against zig's glibc stubs rather than the
      # runner's. `packaging/build-release-asset.sh` refuses to build a Linux
      # archive without this.
      - name: cargo-zigbuild
        run: cargo install cargo-zigbuild --locked --version 0.23.0

      - name: build the archive and install it through install.sh
        run: ./tools/release/verify-artifacts.sh

      # The archive, run on distributions this project claims and the runner is
      # not. 0.1.2 shipped a Linux binary that required GLIBC_2.39 and a
      # `libxdo.so.3` nobody has on Arch, and every gate in this pipeline was
      # green: an ubuntu-latest runner satisfies both by definition, so no
      # amount of testing on it could see either. `check-abi.sh` reads the
      # artifact for those two properties, and this executes it somewhere the
      # runner's assumptions do not hold.
      #
      # Debian 12 is the oldest glibc among the distributions with a packaged
      # WebKitGTK 4.1; Arch is the newest of everything and the one whose
      # library sonames move first. `--version` is enough: the loader resolves
      # every DT_NEEDED before main runs, which is exactly what failed.
      - name: the archive starts on Debian 12 and on Arch
        run: |
          set -eu
          archive=$(ls dist/vitrum-*-x86_64-unknown-linux-gnu.tar.gz)
          rm -rf distro-check
          mkdir -p distro-check
          tar xzf "$archive" -C distro-check
          docker run --rm -v "$PWD/distro-check:/a:ro" debian:12 sh -c '
            set -eu
            apt-get update -qq
            apt-get install -y -qq libwebkit2gtk-4.1-0 libayatana-appindicator3-1 >/dev/null
            /a/vitrum-server --version
            /a/vitrum --version'
          docker run --rm -v "$PWD/distro-check:/a:ro" archlinux:latest sh -c '
            set -eu
            pacman -Syu --noconfirm --needed webkit2gtk-4.1 libayatana-appindicator >/dev/null
            /a/vitrum-server --version
            /a/vitrum --version'
          rm -rf distro-check

  # The README's performance tables are generated from a checked-in snapshot of
  # real harness runs. This job re-renders them and fails if what is committed
  # differs, which catches all three ways those numbers go wrong: a table edited
  # by hand, a snapshot regenerated without re-rendering, and a figure invented
  # in prose. It cannot measure anything, and must not: measurement needs the
  # rig, and a shared runner would publish a number nobody can reproduce.
  docs:
    name: generated docs
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: the performance tables match their snapshot
        run: make perf-tables-check

  # Licenses and advisories. vitrum is dual licensed MIT OR Apache-2.0, and a
  # dependency that is neither is a licensing problem for everyone downstream,
  # so it is worth a job rather than a periodic audit nobody runs.
  deny:
    name: licenses and advisories
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources bans advisories
