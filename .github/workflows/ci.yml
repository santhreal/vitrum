name: ci

# Every push and every pull request. The gates here are the ones RELEASING.md
# names, in the same order, so a green tick means the tree is releasable.
on:
  push:
    branches: [main]
  pull_request:

# A pull request that is pushed to twice must not hold two full matrices. The
# older run is cancelled, because nobody reads a verdict on a commit that has
# been replaced, and the runners it holds are what the next push waits for. A
# queued job that waits too long is cancelled by GitHub with no steps and no
# reason, which reads as a broken pipeline rather than a busy one.
#
# Pushes to main group by run id, so they never cancel each other: those
# verdicts are the release history and each commit keeps its own.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A warning is a failure. The crate ships with none and the only way it stays
  # that way is a machine refusing the push that adds one.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Long enough for a cold Windows build, short enough that a hung job frees
    # its runner the same morning instead of holding it for the six-hour
    # default.
    timeout-minutes: 45
    strategy:
      # One platform failing must not cancel the others: which platforms broke
      # is the useful part of the answer.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # `shared-key`, not `key`: the release archive job compiles the same
      # workspace for the same target, and restoring what the Linux test job
      # already built is the difference between one cold build per push and
      # two.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}

      # The client links the system webview. On Ubuntu that is WebKitGTK, and
      # nothing in the runner image provides it.
      - name: system webview
        if: runner.os == 'Linux'
        run: ./.github/system-webview.sh

      # The terminal engine is built from Ghostty source by `vitrum-vt`, whose
      # default `vendored` route needs Zig. The version is the one Ghostty
      # pins: a newer Zig fails Ghostty's own build-version check, so this is
      # not a floating "latest".
      - name: zig toolchain
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - run: cargo build --release --workspace --locked

      - run: cargo test --release --workspace --locked

      # Advisory, as RELEASING.md says. It reports and never blocks.
      - run: cargo clippy --release --workspace --locked
        continue-on-error: true

      # The installers are the first thing a new user runs, and nothing else in
      # the build reads them. Each is checked on the platform that owns it: a
      # syntax error in either ships silently otherwise, and the Windows one
      # cannot be parsed anywhere else in this pipeline.
      - name: install.sh parses
        if: runner.os == 'Linux'
        run: sh -n install.sh

      - name: install.ps1 parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            foreach ($e in $errors) {
              Write-Output "line $($e.Extent.StartLineNumber): $($e.Message)"
            }
            exit 1
          }
          Write-Output "install.ps1 parses, $($tokens.Count) tokens"

  # The archive the updater downloads is built by a script, and the script and
  # `update::archive_name` must agree. Building it on every push is how a
  # rename is caught before a release rather than by a user whose update fails.
  package:
    name: release archive
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-latest
          # The test job on this platform is the one that populates the cache.
          save-if: false
      - name: system webview
        run: ./.github/system-webview.sh
      - name: zig toolchain
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: ./packaging/build-release-asset.sh
      - name: the checksum must verify
        run: cd dist && sha256sum -c SHA256SUMS
      - name: the binaries must run
        run: |
          mkdir -p /tmp/asset
          tar xzf dist/*.tar.gz -C /tmp/asset
          /tmp/asset/vitrum --version
          /tmp/asset/vitrum-server --version

  # The README's performance tables are generated from a checked-in snapshot of
  # real harness runs. This job re-renders them and fails if what is committed
  # differs, which catches all three ways those numbers go wrong: a table edited
  # by hand, a snapshot regenerated without re-rendering, and a figure invented
  # in prose. It cannot measure anything, and must not: measurement needs the
  # rig, and a shared runner would publish a number nobody can reproduce.
  docs:
    name: generated docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: the README tables match their snapshot
        run: make readme-perf-check

  # Licenses and advisories. vitrum is dual licensed MIT OR Apache-2.0, and a
  # dependency that is neither is a licensing problem for everyone downstream,
  # so it is worth a job rather than a periodic audit nobody runs.
  deny:
    name: licenses and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources bans advisories
