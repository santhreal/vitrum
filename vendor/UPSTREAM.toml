# Where this fork came from and exactly how it differs.
#
# `tools/upstream/check.sh` reads this file, downloads the pristine crate named
# below, and fails if the real divergence is not the divergence listed here. So
# this is not a description of the fork, it is the definition of it: adding a
# change to `vendor/src` without adding it here breaks the check, which is the
# point. A fork nobody can diff is a fork nobody can ever un-fork.

[upstream]
crate = "dioxus-desktop"
version = "0.7.10"

# Only `src/` is compared. The rest is ours on purpose: `Cargo.toml` is
# rewritten for the rename and to switch doctests off, `README.md` documents the
# fork, and `LICENSE` is upstream's MIT carried explicitly because the packaged
# crate omits it.
#
# `Cargo.toml` also turns off three default features, and that is not
# cosmetic, so re-apply it on every absorption. `muda` and `tray-icon` are
# taken with `default-features = false` because muda's default pulls `libxdo`,
# which puts `libxdo.so.3` in the client's DT_NEEDED list; Arch ships only
# `libxdo.so.4`, so 0.1.2 could not start there at all. `tungstenite` is taken
# with only `handshake` because its default pulls `native-tls` and OpenSSL
# into a tree that otherwise uses rustls, and `libssl.so.3` does not exist on
# Debian 10 or RHEL 8. `tools/release/check-abi.sh` fails the release archive
# if any of the three comes back.
compare = "src"

# Every file in `vendor/src` that differs from upstream. The check fails on a
# file that diverges and is not here, and on a file that is here and no longer
# diverges. The second half matters most: it is what tells you a divergence has
# become dead and can be dropped on the next absorption.

[[divergence]]
file = "src/webview.rs"
reason = """
Two changes, both on Linux.

The reason the fork exists. On Linux each new webview is built with
`with_related_view` pointed at a live webview, so every window runs inside the
first window's WebKitWebProcess instead of starting its own network process.
Measured at 8.6 MB PSS per avoided process, so 171.2 MB across twenty windows.
`LIVE_WEBKIT_VIEWS` tracks which views are still real so the relation target is
never a dead widget.

And the launch flash. `background_color` was honoured by neither surface that
paints before a document does. The GTK window kept its theme background, and
wry's WebKitGTK backend builds the view's colour with
`gdk::RGBA::new(red as _, ...)` from the `u8` quadruple, though a GDK channel
is an `f64` on 0.0..=1.0: `(6, 6, 8, 255)` arrives as `RGBA(6.0, 6.0, 8.0,
255.0)` and clamps to opaque white, so every colour that is not black paints
white. Filmed launching on a bare X server, a dark application showed a
full-screen white frame on its way to being dark. The window now takes the
colour through a CSS provider and the view takes it through webkit2gtk in the
units GDK reads, and the flash is gone from the film.

The window is also drawn before the webview is built rather than after. Nothing
painted it until the event loop started, which is on the far side of WebKit's
initialisation, so the screen was black for the whole of it: the window was in
the tree at 75 ms and the first pixel arrived at 690. Draining the pending GTK
events once, right after the window is built, puts that first paint at 100 ms.
"""
upstreamable = true

[[divergence]]
file = "src/app.rs"
reason = """
A warning fix, not a behaviour change. Upstream imports `Duration` at module
scope and also inside a function that re-imports it, so in this crate's
configuration the outer import is unused. CI builds with `-D warnings`, which
makes an unused import a build failure. The outer import is dropped and its one
use is fully qualified.
"""
upstreamable = true

[[divergence]]
file = "src/config.rs"
reason = """
One doc comment says `use vitrum_dioxus_desktop::Config` rather than
`use dioxus_desktop::Config`, because that is the crate's name here. Inert:
`[lib] doctest = false` means it never runs. Kept anyway so the rendered docs
are not wrong, and it is one line.
"""
upstreamable = false
