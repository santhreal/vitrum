[package]
name = "vitrum-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Load, concurrency, fuzzing and profiling harness for the vitrum daemon."
publish = false

[dependencies]
vitrum-core = { workspace = true }
vitrum-grid = { workspace = true }
vitrum-model = { workspace = true }
vitrum-proto = { workspace = true }
vitrum-replay = { workspace = true }
vitrum-search = { workspace = true }
vitrum-vt = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "process", "signal"] }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[lib]
name = "vitrum_bench"
path = "src/lib.rs"

[[bin]]
name = "vitrum-bench"
path = "src/main.rs"
