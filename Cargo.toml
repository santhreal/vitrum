[workspace]
members = [
    "crates/vitrum-proto",
    "crates/vitrum-core",
    "crates/vitrum-server",
    "crates/vitrum-grid",
    "crates/vitrum-vt",
    "crates/vitrum-replay",
    "crates/vitrum-model",
    "crates/vitrum-fmt",
    "crates/vitrum-os",
    "crates/vitrum-search",
    "crates/vitrum-bench",
    "app",
    "vendor",
    "vendor-pty",
    "vendor-ghostty-vt-sys",
]
resolver = "3"

# libghostty-vt-sys 0.2.1 passes -Dtarget to zig only when cross-compiling, so
# a native build compiles for the builder's CPU. Every target this project
# publishes is built natively, which made the instruction set of a release a
# property of whichever runner produced it: two builds of the same crate on
# this one machine disagreed, and the path the release workflow takes emitted
# AVX2. That is an illegal instruction on everything pre-Haswell and on every
# Atom, Celeron and Pentium through Jasper Lake, and it arrives as a bare
# SIGILL. The fork pins -Dtarget and -Dcpu=baseline on all four targets.
#
# WHAT THIS DOES NOT COVER: `[patch.crates-io]` is ignored by registry builds,
# so `cargo install vitrum` still compiles against upstream's build script and
# can still produce a host-tuned binary. The exposure that matters is closed
# because what this project publishes is prebuilt archives built from this
# repository, and `tools/release/check-isa.sh` disassembles them before a
# release is promoted. Closing the registry path too means forking
# `libghostty-vt` as well so its dependency resolves to a name we own, which
# is not worth its maintenance while the fix is six lines upstream can take.
[patch.crates-io]
libghostty-vt-sys = { path = "vendor-ghostty-vt-sys" }

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>"]
repository = "https://github.com/santhreal/vitrum"

[workspace.dependencies]
# Each internal dependency carries BOTH a path and a version. The path is what
# the workspace builds against; the version is what `cargo package` writes into
# the published manifest, and without it packaging refuses the crate outright.
#
# The literal must track `workspace.package.version` above. Cargo has no
# `version.workspace = true` here, so a release that bumps one and not the
# other publishes crates that cannot resolve each other. A test in
# `crates/vitrum-proto` asserts the two agree.
vitrum-proto = { path = "crates/vitrum-proto", version = "0.1.2" }
vitrum-core = { path = "crates/vitrum-core", version = "0.1.2" }
vitrum-grid = { path = "crates/vitrum-grid", version = "0.1.2" }
vitrum-vt = { path = "crates/vitrum-vt", version = "0.1.2" }
vitrum-model = { path = "crates/vitrum-model", version = "0.1.2" }
vitrum-replay = { path = "crates/vitrum-replay", version = "0.1.2" }
vitrum-fmt = { path = "crates/vitrum-fmt", version = "0.1.2" }
vitrum-os = { path = "crates/vitrum-os", version = "0.1.2" }
vitrum-search = { path = "crates/vitrum-search", version = "0.1.2" }

# The forked webview renderer, a named dependency and not a `[patch]`. See
# `vendor/README.md`; the version tracks the upstream release it forks.
vitrum-dioxus-desktop = { path = "vendor", version = "0.7.10" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The forked pty backend, a named dependency for the same reason as the renderer
# above. See `vendor-pty/README.md`; the version tracks the upstream release it
# forks.
portable-pty = { package = "vitrum-portable-pty", path = "vendor-pty", version = "0.9.0" }
# `signal` so the daemon can end its sessions deliberately on SIGTERM rather
# than leaving the kernel to hang up their terminals, which a child that
# ignores SIGHUP survives.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
futures-util = "0.3"
tokio-tungstenite = "0.24"
regex = "1"
memchr = "2"

# The daemon's authentication token, and nothing else. A CSPRNG crate would
# bring a generator this has no use for: the token is 32 bytes read once per
# daemon start, so the operating system's own entropy source is the whole
# requirement, and `getrandom` is already in the lockfile through the TLS
# stack.
# `std` so its error type is a `std::error::Error` and can be the source of
# one of ours.
getrandom = { version = "0.3", features = ["std"] }

# The updater's HTTP client. `rustls` rather than the platform TLS because
# `rustls` is already in the lockfile through tokio-tungstenite, so this adds a
# client and no second TLS stack. Blocking on purpose: the terminal path is a
# one-shot command and the window path already runs it off the UI thread.
ureq = { version = "2", default-features = false, features = ["tls", "json", "gzip"] }
semver = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
