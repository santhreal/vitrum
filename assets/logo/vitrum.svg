<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="vitrum">
  <title>vitrum</title>
  <!--
    A cut stone seen face on: a table across the top, a girdle, and a pavilion
    coming to a point. The V of the pavilion facets and the T dropping from the
    table are the mark. The girdle is drawn as two segments, left edge to the
    left facet and right facet to the right edge, so the middle stays open and
    the V reads through it.

    Geometry sits on a 96 unit grid. The girdle meets the facet lines at
    x = 35.4 and x = 60.6, which is where the lines from the table corners
    (30,24) and (66,24) to the culet (48,84) cross y = 42.
  -->
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Crown: left shoulder, table, right shoulder. -->
    <path d="M12 42 L30 24 H66 L84 42" />
    <!-- Pavilion: shoulders down to the culet. -->
    <path d="M12 42 L48 84 L84 42" />
    <!-- Girdle, open across the middle. -->
    <path d="M12 42 H35.4" />
    <path d="M60.6 42 H84" />
    <!-- The V: table corners to the culet. -->
    <path d="M30 24 L48 84" />
    <path d="M66 24 L48 84" />
    <!-- The T: a stem from the middle of the table through the girdle. -->
    <path d="M48 24 V50" />
  </g>
</svg>
