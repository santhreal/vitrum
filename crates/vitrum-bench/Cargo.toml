[package]
name = "vitrum-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Load, concurrency, fuzzing, latency and profiling harness for vitrum."
publish = false

[features]
# The daemon workloads. `pipeline` links `vitrum-core` and drives a real
# SessionManager, which is the only thing here that needs it. The latency
# workload measures the pane and needs a GPU instead, so it stays buildable on
# a host that has no reason to compile the daemon.
default = ["daemon"]
daemon = ["dep:vitrum-core"]
# Compile the frame-phase instrumentation into the renderer and the VT engine,
# so `frame` can run its `off` and `on` arms. Off by default, which is what
# makes the `absent` arm a real control: `harness/frame.sh` builds this binary
# both ways and compares them.
probe = ["vitrum-grid/probe", "vitrum-vt/probe"]

[dependencies]
vitrum-core = { workspace = true, optional = true }
vitrum-grid = { workspace = true }
vitrum-model = { workspace = true }
vitrum-proto = { workspace = true }
vitrum-replay = { workspace = true }
vitrum-search = { workspace = true }
vitrum-vt = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "process", "signal"] }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
# The latency workload ends every sample on the GPU's fence, which needs the
# device handle `vitrum-grid` renders through. Same major as `vitrum-grid`
# depends on, so cargo unifies them and there is one `wgpu::Device` type.
wgpu = { version = "29", default-features = false, features = ["std"] }
# A pseudoterminal with no child on it, which is the transport a keystroke
# really crosses. `openpty` and `poll`, and nothing else.
libc = "0.2"

[lib]
name = "vitrum_bench"
path = "src/lib.rs"

[[bin]]
name = "vitrum-bench"
path = "src/main.rs"
